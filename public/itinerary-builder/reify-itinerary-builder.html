<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reify Itinerary Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    if (new URLSearchParams(window.location.search).get("embedded") === "1") {
      document.documentElement.classList.add("embedded");
    }
  </script>
  <style>
    :root {
      --teal: #1a2e2a;
      --amber: #c4834a;
      --sage: #8A9A84;
      --bg: #faf8f4;
      --card: #ffffff;
      --border: #e0dbd3;
      --muted: #aaaaaa;
      --ink: #26322f;
      --soft: #f1ece4;
      --danger: #c74e40;
      --warm: #3f7eb9;
      --hot: #d98232;
      --converted: #4f9d69;
      --shadow: 0 14px 40px rgba(26, 46, 42, .10);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      line-height: 1.45;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px 1fr;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--teal);
      color: white;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .14);
    }

    .brand-lockup {
      display: grid;
      gap: 2px;
    }

    .brand-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-subtitle {
      color: rgba(255,255,255,.72);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .logo-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .main-tabs {
      display: grid;
      gap: 8px;
    }

    .tab-button {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: transparent;
      color: rgba(255,255,255,.78);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      transition: background .16s ease, color .16s ease;
    }

    .tab-button:hover,
    .tab-button.active {
      background: rgba(255,255,255,.10);
      color: white;
    }

    .storage-chip {
      margin-top: auto;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      color: rgba(255,255,255,.68);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .content {
      padding: 28px;
      min-width: 0;
    }

    .embedded body {
      background: #f0f7f9;
    }

    .embedded .app-shell {
      display: block;
      min-height: 100vh;
    }

    .embedded .sidebar,
    .embedded .topbar {
      display: none;
    }

    .embedded .content {
      padding: 0;
      background: #f0f7f9;
    }

    .embedded .editor-layout {
      margin-top: 0;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    h1, h2, h3 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--teal);
    }

    h1 { font-size: clamp(32px, 5vw, 52px); line-height: .98; }
    h2 { font-size: 32px; line-height: 1.05; }
    h3 { font-size: 23px; line-height: 1.1; }

    .muted { color: #6f7773; }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 40px;
      border-radius: var(--radius);
      padding: 10px 14px;
      background: var(--teal);
      color: white;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn.secondary {
      background: var(--soft);
      color: var(--teal);
      border: 1px solid var(--border);
    }

    .btn.amber {
      background: var(--amber);
    }

    .icon-btn {
      width: 40px;
      min-height: 40px;
      justify-content: center;
      padding: 0;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    label {
      display: grid;
      gap: 7px;
      color: #57615d;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      min-height: 42px;
      padding: 10px 12px;
      color: var(--ink);
      outline: none;
    }

    textarea {
      min-height: 108px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(138,154,132,.16);
    }

    .parse-area {
      min-height: 152px;
      background: #fffdf8;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .lead-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
    }

    .lead-table th,
    .lead-table td {
      padding: 13px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    .lead-table th {
      color: #6f7773;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .status-pill {
      display: inline-flex;
      border-radius: 999px;
      padding: 5px 9px;
      background: var(--soft);
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
    }

    .temp-dot {
      display: inline-flex;
      width: 11px;
      height: 11px;
      border-radius: 99px;
      margin-right: 8px;
      vertical-align: -1px;
      background: var(--warm);
    }

    .temp-waste { background: var(--danger); border-radius: 0; transform: rotate(45deg); }
    .temp-warm { background: var(--warm); }
    .temp-hot { background: var(--hot); }
    .temp-converted { background: var(--converted); }

    .editor-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 18px;
      align-items: start;
    }

    .editor-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
      margin-bottom: 10px;
    }

    .editor-tab {
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: white;
      color: var(--teal);
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .editor-tab.active {
      background: var(--teal);
      color: white;
      border-color: var(--teal);
    }

    .editor-pane {
      display: none;
    }

    .editor-pane.active {
      display: grid;
      gap: 16px;
    }

    .version-toolbar {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 12px;
      display: grid;
      gap: 12px;
    }

    .version-toolbar-grid {
      display: grid;
      grid-template-columns: 220px 180px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
    }

    .version-toolbar-button-group {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .version-toolbar-button-group .btn {
      white-space: nowrap;
    }

    .version-toolbar label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: #6f7773;
      font-weight: 700;
    }

    .version-toolbar-note {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--soft);
      color: var(--teal);
      font-size: 14px;
      min-height: 46px;
      display: flex;
      align-items: center;
    }

    .version-toolbar-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .version-readonly-banner {
      border: 1px solid rgba(196, 131, 74, .45);
      background: #fff7ef;
      color: #7a5531;
      border-radius: var(--radius);
      padding: 12px 14px;
      font-weight: 600;
    }

    .readonly-pane {
      opacity: .92;
    }

    .readonly-pane input:not([type="hidden"]),
    .readonly-pane select,
    .readonly-pane textarea,
    .readonly-pane button:not([data-version-create]) {
      pointer-events: none;
    }

    .mini-spec {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .mini-spec li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 9px;
    }

    .mini-spec span:first-child {
      color: #6f7773;
    }

    .calculator-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      align-items: start;
    }

    .calculator-table-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      background: white;
    }

    .calculator-table {
      width: 100%;
      min-width: 1040px;
      border-collapse: collapse;
      font-size: 13px;
    }

    .calculator-table th,
    .calculator-table td {
      border-bottom: 1px solid var(--border);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    .calculator-table th {
      color: #6f7773;
      background: #fbfaf7;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .calculator-table tfoot td {
      background: #f4f8f0;
      font-weight: 800;
      color: var(--teal);
    }

    .calculator-table input,
    .calculator-table select {
      min-height: 34px;
      padding: 7px 8px;
      font-size: 13px;
    }

    .calculator-table .icon-btn {
      width: 34px;
      height: 34px;
      justify-content: center;
      padding: 0;
    }

    .version-list {
      display: grid;
      gap: 10px;
    }

    .version-card {
      display: grid;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: #fffdf8;
    }

    .version-card.active {
      border-color: var(--sage);
      background: #f4f8f0;
    }

    .version-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .version-total {
      color: var(--teal);
      font-size: 20px;
      font-weight: 800;
    }

    .trip-summary-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .trip-summary-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: #fbfaf7;
    }

    .trip-summary-card span {
      display: block;
      color: #6f7773;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .trip-summary-card strong {
      color: var(--teal);
      font-size: 18px;
    }

    .about-title-rule {
      width: 48px;
      height: 3px;
      border-radius: 999px;
      background: var(--amber);
      margin-top: 8px;
    }

    .duration-pill {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: #f1ece4;
    }

    .duration-pill span {
      display: block;
      color: #6f7773;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .duration-pill strong {
      color: var(--teal);
      font-size: 22px;
      line-height: 1.05;
    }

    .date-connector {
      width: 22px;
      height: 2px;
      border-radius: 999px;
      background: var(--amber);
      opacity: .75;
    }

    .inclusion-switches {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .inclusion-switches label {
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: white;
      text-transform: none;
      letter-spacing: 0;
      font-size: 14px;
    }

    .inclusion-switches input {
      width: auto;
      accent-color: var(--sage);
    }

    .route-stop-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 120px 42px;
      gap: 10px;
      align-items: end;
    }

    .about-route {
      display: grid;
      gap: 0;
    }

    .about-route-item {
      position: relative;
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
    }

    .about-route-item.featured {
      background: linear-gradient(90deg, #f1ece4, rgba(241,236,228,0));
      padding: 16px 0;
    }

    .route-number {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #807b70;
      background: var(--bg);
      border: 2px solid #ded8cf;
      font-weight: 800;
      font-size: 12px;
      z-index: 1;
    }

    .about-route-item:not(:last-child) .route-number::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 34px;
      width: 1px;
      height: 42px;
      background: #d8d0c5;
      transform: translateX(-50%);
      z-index: -1;
    }

    .route-location {
      color: var(--teal);
      font-size: 20px;
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      line-height: 1.05;
    }

    .route-meta {
      margin: 5px 0 0;
      color: #8a857a;
      font-size: 12px;
    }

    .route-tag {
      justify-self: end;
      border: 1px solid #c9c0b3;
      border-radius: 3px;
      padding: 7px 12px;
      color: #807b70;
      background: #e8e1d7;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .route-night-count {
      justify-self: end;
      color: #8a857a;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .route-number.terminal {
      background: #fbfaf7;
      border: 2px solid #bdb5aa;
      box-shadow: 0 0 0 5px #e8e1d7;
      color: #807b70;
    }

    .inclusion-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: 10px;
    }

    .inclusion-card {
      min-height: 94px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #fbfaf7;
      padding: 12px;
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .inclusion-card strong {
      color: var(--teal);
      font-size: 13px;
      font-weight: 800;
    }

    .inclusion-card p {
      margin: 0;
      color: #6f7773;
      font-size: 11px;
      line-height: 1.35;
    }

    .mobile-preview-wrap {
      position: sticky;
      top: 20px;
      display: grid;
      gap: 12px;
    }

    .phone-preview {
      width: 390px;
      max-width: 100%;
      min-height: 720px;
      background: var(--bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .itinerary-output {
      background: var(--bg);
      color: var(--teal);
      font-size: 14px;
    }

    .hero {
      min-height: 430px;
      color: white;
      padding: 22px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(180deg, rgba(26,46,42,.30), rgba(26,46,42,.92)),
        url("assets/default-hero.jpg") center/cover;
    }

    .hero-logo {
      align-self: flex-end;
      max-width: 175px;
      max-height: 54px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.25));
    }

    .hero-logo.fallback {
      font-family: "Cormorant Garamond", serif;
      font-size: 24px;
      font-weight: 700;
      color: white;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      min-height: 310px;
      position: relative;
      min-height: 100%;
      padding-top: 52px;
      padding-bottom: 18px;
    }

    .hero-intro-block {
      display: grid;
      gap: 8px;
      margin-top: 28px;
    }

    .hero-trip-block {
      display: grid;
      gap: 4px;
      margin-top: auto;
      padding-top: 86px;
      padding-bottom: 0;
    }

    .hero-kicker {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .hero h2 {
      color: white;
      font-size: 42px;
      line-height: .96;
      margin-bottom: 0;
    }

    .hero-name-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hero-pax {
      color: white;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      margin-top: 2px;
    }

    .hero-duration {
      color: white;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      margin-top: 2px;
    }

    .hero-copy > p:last-child {
      display: none;
    }

    .hero .trip-prefix,
    .hero .trip-suffix {
      color: #8A9A84;
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      font-style: italic;
      line-height: 1;
    }

    .hero .destination {
      color: white;
      font-family: "Cormorant Garamond", serif;
      font-size: 38px;
      font-style: italic;
      line-height: .95;
      margin: 5px 0;
    }

    .output-section {
      padding: 24px 20px;
      display: grid;
      gap: 14px;
      border-bottom: 1px solid var(--border);
    }

    .price-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .cost-card {
      background: linear-gradient(180deg, #f2f7ee, #e9f0e7);
      border: 1px solid #d6dfd2;
      border-radius: 6px;
      padding: 16px 18px;
      color: var(--teal);
      display: grid;
      gap: 10px;
    }

    .cost-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .cost-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--sage);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .cost-sub {
      font-size: 11px;
      color: #6f7773;
      margin-top: 4px;
    }

    .cost-amount {
      font-size: 48px;
      font-weight: 800;
      line-height: .95;
      color: var(--teal);
      text-align: right;
    }

    .cost-amount.total-single {
      font-size: 40px;
      white-space: nowrap;
      line-height: 1;
    }

    .cost-card.total-layout {
      gap: 8px;
    }

    .cost-card.total-layout .cost-label-line {
      font-size: 11px;
      font-weight: 800;
      color: var(--sage);
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .cost-card .cost-tax {
      letter-spacing: 0;
      text-transform: none;
      font-weight: 700;
      color: #6f7773;
      white-space: nowrap;
    }

    .cost-card.total-layout .cost-amount {
      font-size: 34px;
      white-space: nowrap;
      text-align: left;
      line-height: 1;
    }

    .cost-card .cost-meta {
      font-size: 12px;
      color: #6f7773;
      font-weight: 800;
    }

    .family-grand-row {

    function normalizeCabTermsWithDefaults(terms, fallbackTerms) {
      const nextDefaults = [...(Array.isArray(fallbackTerms) && fallbackTerms.length ? fallbackTerms : defaultState.masterData.settings.defaultCabTerms)];
      const raw = Array.isArray(terms) ? terms : typeof terms === "string" ? terms.split(/\r?\n/) : [];
      if (!raw.length) return [...nextDefaults];
      const cleaned = raw.map(item => String(item || "").trim()).filter(Boolean);
      const joined = cleaned.join(" ").toLowerCase();
      const looksLikeOldDefault = joined.includes("cab is available for planned itinerary use only") && (
        joined.includes("vehicle change may happen")
        || joined.includes("permits are payable")
        || joined.includes("parking, tolls and permits")
      );
      if (looksLikeOldDefault) return [...nextDefaults];
      return cleaned;
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const normalized = normalizeAppState(saved ? { ...defaultState, ...saved } : structuredClone(defaultState));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
        return normalized;
      } catch (error) {
        const normalized = normalizeAppState(structuredClone(defaultState));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
        return normalized;
      }
    }

    function normalizeAppState(state) {
      const normalized = {
        ...structuredClone(defaultState),
        ...(state || {}),
        masterData: {
          ...structuredClone(defaultState.masterData),
          ...((state || {}).masterData || {}),
          settings: {
            ...structuredClone(defaultState.masterData.settings),
            ...(((state || {}).masterData || {}).settings || {})
          }
        }
      };
      if (!Array.isArray(normalized.masterData.locations) || !normalized.masterData.locations.length) {
        normalized.masterData.locations = defaultLocationNames.map(name => ({ id: uid(), name }));
      } else {
        normalized.masterData.locations = normalized.masterData.locations.map(item => typeof item === "string" ? { id: uid(), name: item } : { id: item.id || uid(), name: item.name || "" });
      }
      if (!Array.isArray(normalized.masterData.hotels)) normalized.masterData.hotels = [];
      if (!Array.isArray(normalized.masterData.cabTypes) || !normalized.masterData.cabTypes.length) {
        normalized.masterData.cabTypes = defaultCabTypes.map(name => ({ id: uid(), name, note: "" }));
      } else {
        normalized.masterData.cabTypes = normalized.masterData.cabTypes.map(item => typeof item === "string" ? { id: uid(), name: item, note: "" } : { id: item.id || uid(), name: item.name || "", note: item.note || "" });
      }
      normalized.masterData.settings.defaultCabTerms = normalizeCabTermsWithDefaults(
        normalized.masterData.settings.defaultCabTerms,
        defaultState.masterData.settings.defaultCabTerms
      );
      if (Array.isArray(normalized.leads)) {
        normalized.leads = normalized.leads.map(lead => {
          if (!lead || !lead.itinerary) return lead;
          const next = { ...lead, itinerary: { ...lead.itinerary } };
          next.itinerary.cabTerms = normalizeCabTermsWithDefaults(
            next.itinerary.cabTerms || normalized.masterData.settings.defaultCabTerms,
            normalized.masterData.settings.defaultCabTerms
          );
          return next;
        });
      }
      return normalized;
    }

    function scheduleSharedRouteMasterSave() {

    async function saveSharedRouteMaster() {
      if (!CRM_EMBEDDED) return;
      try {
        const routes = (appState.masterData.routes || []).map(route => normalizeRouteTemplate(route, route.source || "custom"));
        await fetch(SHARED_ROUTES_ENDPOINT, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ routes })
        });
      } catch (error) {
        console.warn("Route Master sync failed", error);
      }
    }

    async function loadSharedRouteMaster() {
      if (!CRM_EMBEDDED) return;
      try {
        const response = await fetch(SHARED_ROUTES_ENDPOINT, { cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) return;
        if (Array.isArray(data.routes) && data.routes.length) {
          const mergedRoutes = mergeRouteTemplates(data.routes);
          appState.masterData.routes = mergedRoutes;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          renderMasterPane(activeMasterTab);
          renderAll();
          if (mergedRoutes.length > data.routes.length) await saveSharedRouteMaster();
          return;
        }
        if (Array.isArray(appState.masterData.routes) && appState.masterData.routes.length) {
          appState.masterData.routes = mergeRouteTemplates(appState.masterData.routes);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          await saveSharedRouteMaster();
          return;
        }
        ensureMasterRoutes();
      } catch (error) {
        console.warn("Route Master load failed", error);
      }
    }

    function uid() {

    function formatDate(value) {
      if (!value) return "-";
      const date = new Date(value + "T00:00:00");
      return date.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
    }

    function weekday(value) {
      if (!value) return "";
      return new Date(value + "T00:00:00").toLocaleDateString("en-IN", { weekday: "long" });
    }

    function addDays(dateValue, days) {
      if (!dateValue || !days) return "";
      const date = new Date(dateValue + "T00:00:00");
      date.setDate(date.getDate() + Number(days) - 1);
      return date.toISOString().slice(0, 10);
    }

    function calculatedEndDate(lead) {
      return addDays(lead.startDate, lead.days) || lead.endDate || "";
    }

    function cabTypeOptions() {

    function cabSpecificNote(cabType = "") {
      const masterCab = cabTypeOptions().find(item => item.name.toLowerCase() === String(cabType || "").toLowerCase());
      if (masterCab?.note) return masterCab.note;
      const normalized = cabType.toLowerCase();
      if (normalized.includes("sedan") || normalized.includes("swift") || normalized.includes("wagon")) {
        return "Sedan fits 3-4 medium suitcases";
      }
      if (normalized.includes("innova crysta")) {
        return "Innova Crysta is with carrier and fits 5 medium suitcases";
      }
      if (normalized.includes("tempo") || normalized.includes("urbania")) {
        return "Used for group sightseeing and intercity transfers throughout the trip.";
      }
      if (normalized.includes("ertiga") || normalized.includes("xylo")) {
        return "Comfortable for small families with moderate luggage.";
      }
      return "Please pack according to vehicle luggage capacity.";
    }

    function cabSegmentKey(cab = {}) {

    function ensureCabDetails(lead, itinerary) {
      return Array.isArray(itinerary.cabDetails) && itinerary.cabDetails.length
        ? itinerary.cabDetails.map(cab => ({
          ...defaultCabDetail(lead),
          ...cab,
          id: cab.id || uid(),
          segmentId: cab.segmentId || cabSegmentKey(cab)
        }))
        : [defaultCabDetail(lead)];
    }

    function nextCabForSameSegment(lead, cabs = []) {
      const base = cabs[0] || defaultCabDetail(lead);
      const nextType = base.cabType === "Innova Crysta" ? "Sedan / Swift Dzire" : "Innova Crysta";
      return {
        ...defaultCabDetail(lead, base.segment || "Trip Vehicle"),
        segmentId: base.segmentId || cabSegmentKey(base),
        segment: base.segment || "Trip Vehicle",
        dayLabel: base.dayLabel || `Day 1-${lead.days || 1}`,
        dateLabel: base.dateLabel || `${formatDate(lead.startDate)} - ${formatDate(calculatedEndDate(lead))}`,
        coverage: base.coverage || "For all sightseeing",
        pickupPoint: base.pickupPoint || "Guwahati Airport",
        useBasis: base.coverage === "For Transfer only" ? "Transfers Only" : (base.useBasis || "Disposal Basis"),
        acType: base.acType || "Private AC",
        cabType: nextType,
        note: cabSpecificNote(nextType)
      };
    }

    function groupCabsBySegment(cabs = []) {
      return cabs.reduce((groups, cab) => {
        const key = cab.segmentId || cabSegmentKey(cab);
        const existing = groups.find(group => group.key === key);
        if (existing) {
          existing.cabs.push(cab);
        } else {
          groups.push({
            key,
            segmentId: key,
            segment: cab.segment || "Trip Vehicle",
            coverage: cab.coverage || "For Transfers and sightseeing",
            dateLabel: cab.dateLabel || "",
            useBasis: cab.coverage === "For Transfer only" ? "Transfers Only" : (cab.useBasis || "Disposal Basis"),
            cabs: [cab]
          });
        }
        return groups;
      }, []);
    }

      const childCount = Number(children || 0);

    function normalizeCabTerms(terms) {
      const fallback = appState && appState.masterData && appState.masterData.settings && Array.isArray(appState.masterData.settings.defaultCabTerms)
        ? appState.masterData.settings.defaultCabTerms
        : defaultState.masterData.settings.defaultCabTerms;
      return normalizeCabTermsWithDefaults(terms, fallback);
    }

    function cloneSnapshot(snapshot = {}) {
      return JSON.parse(JSON.stringify(snapshot || {}));
    }

    function normalizeItineraryData(lead, source = {}) {
      const defaults = defaultItinerary(lead);
      const next = {
        ...defaults,
        ...(source || {}),
        inclusions: {
          ...defaults.inclusions,
          ...((source || {}).inclusions || {})
        },
        cabTerms: normalizeCabTerms((source || {}).cabTerms || defaults.cabTerms),
        cabDetails: ensureCabDetails(lead, { cabDetails: (source || {}).cabDetails || defaults.cabDetails }),
        costCalculator: ensureCostCalculator({ costCalculator: (source || {}).costCalculator || defaults.costCalculator })
      };
      next.goodToKnow = ensureGoodToKnow(next.goodToKnow);
      return next;
    }

    function validItineraryVersionStatus(value = "") {
      return ITINERARY_VERSION_STATUSES.includes(value) ? value : "Draft";
    }

    function itineraryVersionNumber(version = {}) {
      const match = String(version.label || "").match(/^V(\d+)$/i);
      if (match) return Number(match[1]);
      return Number(version.number || 0) || 0;
    }

    function nextItineraryVersionNumber(versions = []) {
      return versions.reduce((max, version) => Math.max(max, itineraryVersionNumber(version)), 0) + 1;
    }

    function normalizeItineraryVersion(lead, version = {}, index = 0) {
      const number = itineraryVersionNumber(version) || (index + 1);
      const createdAt = version.createdAt || new Date().toISOString();
      return {
        id: version.id || uid(),
        label: version.label || `V${number}`,
        number,
        status: validItineraryVersionStatus(version.status),
        note: version.note || (number === 1 ? "Initial proposal" : ""),
        createdAt,
        updatedAt: version.updatedAt || createdAt,
        snapshot: normalizeItineraryData(lead, cloneSnapshot(version.snapshot || lead.itinerary || {}))
      };
    }

    function ensureItineraryVersioning(lead, options = {}) {
      const baseSnapshot = normalizeItineraryData(lead, lead.itinerary || {});
      let versions = Array.isArray(lead.itineraryVersions) && lead.itineraryVersions.length
        ? lead.itineraryVersions.map((version, index) => normalizeItineraryVersion(lead, version, index))
        : [normalizeItineraryVersion(lead, { label: "V1", number: 1, status: "Draft", note: "Initial proposal", snapshot: baseSnapshot }, 0)];
      versions = versions.sort((left, right) => left.number - right.number);
      lead.itineraryVersions = versions;
      if (!Array.isArray(appState.itineraryLibrary)) appState.itineraryLibrary = [];
      const selectedId = versions.some(version => version.id === lead.selectedItineraryVersionId)
        ? lead.selectedItineraryVersionId
        : versions[versions.length - 1].id;
      lead.selectedItineraryVersionId = selectedId;
      const selected = versions.find(version => version.id === selectedId) || versions[versions.length - 1];
      if (typeof lead.itineraryVersionDraftDirty !== "boolean") lead.itineraryVersionDraftDirty = false;
      lead.itinerary = normalizeItineraryData(lead, options.preserveCurrentItinerary ? (lead.itinerary || selected.snapshot) : cloneSnapshot(selected.snapshot));
      return lead;
    }

    function selectedItineraryVersion(lead = selectedLead()) {
      if (!lead) return null;
      ensureItineraryVersioning(lead, { preserveCurrentItinerary: true });
      return lead.itineraryVersions.find(version => version.id === lead.selectedItineraryVersionId) || lead.itineraryVersions[lead.itineraryVersions.length - 1] || null;
    }

    function latestItineraryVersion(lead = selectedLead()) {
      if (!lead) return null;
      ensureItineraryVersioning(lead, { preserveCurrentItinerary: true });
      return lead.itineraryVersions[lead.itineraryVersions.length - 1] || null;
    }

    function isViewingLockedItineraryVersion(lead = selectedLead()) {
      const selected = selectedItineraryVersion(lead);
      const latest = latestItineraryVersion(lead);
      return Boolean(selected && latest && selected.id !== latest.id);
    }

    function ensureItinerary(lead) {
      lead.itinerary = normalizeItineraryData(lead, lead.itinerary || {});
      return lead.itinerary;
    }

    function updateSelectedItineraryVersionMeta(patch = {}, options = {}) {
      const lead = selectedLead();
      if (!lead) return;
      const index = appState.leads.findIndex(item => item.id === lead.id);
      if (index < 0) return;
      ensureItineraryVersioning(lead, { preserveCurrentItinerary: true });
      const selected = selectedItineraryVersion(lead);
      if (!selected) return;
      const now = new Date().toISOString();
      lead.itineraryVersions = lead.itineraryVersions.map(version => version.id === selected.id ? ({
        ...version,
        status: patch.status ? validItineraryVersionStatus(patch.status) : version.status,
        note: Object.prototype.hasOwnProperty.call(patch, "note") ? patch.note : version.note,
        updatedAt: now
      }) : version);
      lead.updatedAt = now;
      appState.leads[index] = lead;
      if (options.refresh === false) localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      else saveState();
      if (options.render !== false) renderEditorPane(activeEditorTab);
    }

    function loadSelectedItineraryVersion(versionId) {
      const lead = selectedLead();
      if (!lead) return;
      const index = appState.leads.findIndex(item => item.id === lead.id);
      if (index < 0) return;
      lead.selectedItineraryVersionId = versionId;
      ensureItineraryVersioning(lead);
      lead.updatedAt = new Date().toISOString();
      appState.leads[index] = lead;
      saveState();
      renderEditorPane(activeEditorTab);
    }

    function createNewItineraryVersionFromSelected(note = "", status = "Draft") {
      const lead = selectedLead();
      if (!lead) return;
      const index = appState.leads.findIndex(item => item.id === lead.id);
      if (index < 0) return;
      ensureItineraryVersioning(lead, { preserveCurrentItinerary: true });
      const source = selectedItineraryVersion(lead);
      if (!source) return;
      const sourceSnapshot = isViewingLockedItineraryVersion(lead)
        ? cloneSnapshot(source.snapshot)
        : cloneSnapshot(normalizeItineraryData(lead, lead.itinerary || source.snapshot));
      const number = nextItineraryVersionNumber(lead.itineraryVersions);
      const now = new Date().toISOString();
      const created = normalizeItineraryVersion(lead, {
        id: uid(),
        label: `V${number}`,
        number,
        status: validItineraryVersionStatus(status),
        note: note || `Based on ${source.label}`,
        createdAt: now,
        updatedAt: now,
        snapshot: sourceSnapshot
      }, number - 1);
      lead.itineraryVersions = [...lead.itineraryVersions, created].sort((left, right) => left.number - right.number);
      lead.selectedItineraryVersionId = created.id;
      lead.itinerary = normalizeItineraryData(lead, cloneSnapshot(created.snapshot));
      lead.itineraryVersionDraftDirty = false;
      lead.updatedAt = now;
      appState.leads[index] = lead;
      saveState();
      renderEditorPane(activeEditorTab);
    }

    function saveSelectedItineraryVersion() {
      const lead = selectedLead();
      if (!lead) return;
      const index = appState.leads.findIndex(item => item.id === lead.id);
      if (index < 0) return;
      ensureItineraryVersioning(lead, { preserveCurrentItinerary: true });
      if (isViewingLockedItineraryVersion(lead)) return;
      const selected = selectedItineraryVersion(lead);
      if (!selected) return;
      const now = new Date().toISOString();
      const snapshot = cloneSnapshot(normalizeItineraryData(lead, lead.itinerary || selected.snapshot));
      lead.itineraryVersions = lead.itineraryVersions.map(version => version.id === selected.id ? ({
        ...version,
        snapshot,
        updatedAt: now
      }) : version);
      lead.itinerary = normalizeItineraryData(lead, snapshot);
      lead.itineraryVersionDraftDirty = false;
      lead.updatedAt = now;
      appState.leads[index] = lead;
      saveState();
      renderEditorPane(activeEditorTab);
    }

    function saveSelectedItineraryToLibrary(title = "", note = "") {
      const lead = selectedLead();
      if (!lead) return;
      ensureItineraryVersioning(lead, { preserveCurrentItinerary: true });
      const selected = selectedItineraryVersion(lead);
      if (!selected) return;
      const now = new Date().toISOString();
      const libraryTitle = title || `${lead.destination || "Saved Itinerary"} - ${lead.days || 0}D`;
      const snapshot = isViewingLockedItineraryVersion(lead)
        ? cloneSnapshot(selected.snapshot)
        : cloneSnapshot(normalizeItineraryData(lead, lead.itinerary || selected.snapshot));
      if (!Array.isArray(appState.itineraryLibrary)) appState.itineraryLibrary = [];
      appState.itineraryLibrary = [...appState.itineraryLibrary, {
        id: uid(),
        title: libraryTitle,
        note: note || selected.note || "",
        sourceVersionId: selected.id,
        sourceVersionLabel: selected.label,
        sourceLeadId: lead.id,
        destination: lead.destination || "",
        days: lead.days || 0,
        pax: lead.pax || 0,
        createdAt: now,
        updatedAt: now,
        snapshot
      }];
      saveState();
      window.alert(`Saved to itinerary library as ${libraryTitle}.`);
    }

    function applyEditorReadOnlyState(panes, locked) {

        const initial = field.getAttribute("data-version-lock-init");
        if (locked) {
          if (initial === null) field.setAttribute("data-version-lock-init", field.disabled ? "1" : "0");
          field.disabled = true;
        } else {
          if (field.getAttribute("data-version-lock-init") === "0") field.disabled = false;
          field.removeAttribute("data-version-lock-init");
        }
      });

      const now = new Date().toISOString();
      const updated = { ...lead, ...patch, updatedAt: now };

        updated.itinerary = normalizeItineraryData(updated, patch.itinerary);

      ensureItineraryVersioning(updated, { preserveCurrentItinerary: true });
      const selected = selectedItineraryVersion(updated);
      if (selected && isViewingLockedItineraryVersion(updated)) {
        updated.itinerary = normalizeItineraryData(updated, cloneSnapshot(selected.snapshot));

      if (Object.prototype.hasOwnProperty.call(patch, "itinerary") && !isViewingLockedItineraryVersion(updated)) {
        updated.itineraryVersionDraftDirty = true;

      appState.leads[index] = updated;
      appState.selectedLeadId = updated.id;
      saveState();
      renderEditorPane(activeEditorTab);

    function allLocationOptions() {
      const routeLocations = combinedRouteTemplates().flatMap(route => [
        route.startLocation,
        route.dropLocation,
        ...(route.stops || []).map(stop => stop.location)
      ]);
      const defaults = ["Guwahati", "Shillong", "Cherrapunjee", "Mawlynnong", "Kaziranga", "Majuli", "Bhalukpong", "Dirang", "Tawang", "Bomdila", "Gangtok", "Pelling", "Darjeeling", "Bagdogra", "NJP / Bagdogra"];
      const masterLocations = (appState.masterData.locations || []).map(item => typeof item === "string" ? item : item.name).filter(Boolean);
      return [...new Set([...defaults, ...masterLocations, ...routeLocations].filter(Boolean))].sort();
    }

    function normalizeRouteTemplate(route, fallbackSource = "master") {
      return {
        id: route.id || uid(),
        source: route.source || fallbackSource,
        templateName: route.templateName || "New Route",
        destination: route.destination || "",
        totalNights: Number(route.totalNights || 0),
        startLocation: route.startLocation || "",
        dropLocation: route.dropLocation || "",
        stops: (route.stops || []).map(stop => ({
          location: stop.location || "",
          nights: Number(stop.nights || 0)
        }))
      };
    }

    function mergeRouteTemplates(routes = []) {
      const merged = new Map(
        routeTemplateLibrary.map(route => {
          const normalized = normalizeRouteTemplate(route, "master");
          return [normalized.id, normalized];
        })
      );
      (Array.isArray(routes) ? routes : []).forEach(route => {
        const normalized = normalizeRouteTemplate(route, route?.source || "custom");
        merged.set(normalized.id, normalized);
      });
      return [...merged.values()];
    }

    function ensureMasterRoutes() {
      if (!Array.isArray(appState.masterData.routes)) appState.masterData.routes = [];
      const mergedRoutes = mergeRouteTemplates(appState.masterData.routes);
      if (mergedRoutes.length !== appState.masterData.routes.length) {
        appState.masterData.routes = mergedRoutes;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } else {
        appState.masterData.routes = mergedRoutes;
      }
      return appState.masterData.routes;
    }

    function normalizeHotelMasterItem(hotel = {}) {
      return {
        id: hotel.id || `hotel-${uid()}`,
        location: hotel.location || "",
        name: hotel.name || hotel.hotelName || "",
        brief: hotel.brief || "",
        rating: hotel.rating || "",
        imageFilename: hotel.imageFilename || hotel.image || "",
        active: hotel.active !== false
      };
    }

    function ensureMasterHotels() {
      if (!Array.isArray(appState.masterData.hotels)) appState.masterData.hotels = [];
      if (!appState.masterData.hotels.length && hotelMasterLibrary.length) {
        appState.masterData.hotels = hotelMasterLibrary.map(normalizeHotelMasterItem);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      }
      appState.masterData.hotels = appState.masterData.hotels.map(normalizeHotelMasterItem);
      return appState.masterData.hotels;
    }

    async function loadHotelMasterSeed() {
      try {
        const response = await fetch(HOTEL_MASTER_JSON_PATH);
        if (!response.ok) return;
        const hotels = await response.json();
        hotelMasterLibrary = Array.isArray(hotels) ? hotels.map(normalizeHotelMasterItem) : [];
        if (!appState.masterData.hotels?.length && hotelMasterLibrary.length) {
          appState.masterData.hotels = hotelMasterLibrary.map(normalizeHotelMasterItem);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }
        if (activeMasterTab === 2) renderMasterPane(activeMasterTab);
      } catch (error) {
        console.warn("Hotel master seed could not be loaded.", error);
      }
    }

    function normalizeSightseeingMasterItem(item = {}) {
      return {
        id: item.id || `sight-${uid()}`,
        destination: item.destination || "",
        town: item.town || item.location || "",
        name: item.name || "",
        category: item.category || "",
        description: item.description || "",
        usp: item.usp || "",
        active: item.active !== false
      };
    }

    function ensureMasterSightseeings() {
      if (!Array.isArray(appState.masterData.sightseeings)) appState.masterData.sightseeings = [];
      if (!appState.masterData.sightseeings.length) {
        appState.masterData.sightseeings = sightseeingMaster.map(normalizeSightseeingMasterItem);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      }
      appState.masterData.sightseeings = appState.masterData.sightseeings.map(normalizeSightseeingMasterItem);
      return appState.masterData.sightseeings;
    }

    function combinedRouteTemplates() {
      return mergeRouteTemplates(appState.masterData.routes);
    }

    function routeTemplatesForDestination(destination = "", totalNights = null) {
      const requiredNights = Number(totalNights);
      const templates = combinedRouteTemplates();
      const matchingDestination = templates.filter(template => template.destination === destination);
      const destinationPool = matchingDestination.length ? matchingDestination : templates;
      const matchingNights = destinationPool.filter(template => !Number.isFinite(requiredNights) || Number(template.totalNights) === requiredNights);
      return matchingNights.length ? matchingNights : destinationPool;
    }

    function routeTemplateLabel(template) {
      const source = template.source === "custom" ? "Custom" : "Master";
      return `${source}: ${template.templateName} (${template.totalNights}N)`;
    }

    function routeTemplateById(templateId = "") {
      return combinedRouteTemplates().find(template => template.id === templateId) || null;
    }

    function routeTemplateCategories() {
      return ["All", ...new Set(combinedRouteTemplates().map(template => template.destination).filter(Boolean))];
    }

    function routeTemplateNightOptions() {
      return ["All", ...[...new Set(combinedRouteTemplates().map(template => Number(template.totalNights || 0)).filter(Boolean))].sort((a, b) => a - b)];
    }

    function filteredRouteTemplates(search = "", destination = "All", totalNights = "All") {
      const normalizedSearch = String(search || "").trim().toLowerCase();
      const requiredNights = totalNights === "All" ? null : Number(totalNights);
      return combinedRouteTemplates().filter(template => {
        if (destination !== "All" && template.destination !== destination) return false;
        if (Number.isFinite(requiredNights) && Number(template.totalNights || 0) !== requiredNights) return false;
        if (!normalizedSearch) return true;
        const stopText = (template.stops || []).map(stop => stop.location || "").join(" ").toLowerCase();
        const haystack = [
          template.templateName,
          template.id,
          template.destination,
          template.startLocation,
          template.dropLocation,
          stopText
        ].join(" ").toLowerCase();
        return haystack.includes(normalizedSearch);
      });
    }

    function distributeNights(locations, requiredNights) {
      if (!locations.length) return [];
      const base = locations.map(location => ({ location, nights: 0 }));
      let remaining = Math.max(Number(requiredNights || 0), 0);
      let index = 0;
      while (remaining > 0) {
        base[index % base.length].nights += 1;
        remaining -= 1;
        index += 1;
      }
      return base;
    }

    function routeTemplatePatch(templateId) {
      const template = combinedRouteTemplates().find(item => item.id === templateId);
      if (!template) return {};
      return {
        routeTemplate: template.id,
        routeTemplateName: template.templateName,
        routeSource: template.source || "master",
        routeModified: false,
        startLocation: template.startLocation,
        dropLocation: template.dropLocation,
        routeStops: (template.stops || []).map(stop => ({ location: stop.location, nights: Number(stop.nights || 0) }))
      };
    }

    function inclusionLabels(inclusions = {}) {
      return [
        inclusions.hotelStays ? { title: "Hotel Stays", text: "Handpicked hotels / stay at each destination." } : null,
        inclusions.premiumCab ? { title: "Premium Cab", text: "Dedicated cab with experienced driver." } : null,
        inclusions.sightseeing ? { title: "Sightseeing", text: "Major sightseeing and attractions covered." } : null
      ].filter(Boolean);
    }

    function dateFromStart(lead, offset) {
      if (!lead.startDate) return null;
      const date = new Date(lead.startDate + "T00:00:00");
      date.setDate(date.getDate() + Number(offset || 0));
      return date;
    }

    function dayDateLabel(lead, offset, options = { year: false }) {
      const date = dateFromStart(lead, offset);
      if (!date) return "-";
      return date.toLocaleDateString("en-IN", options.year ? { day: "2-digit", month: "short", year: "numeric" } : { day: "2-digit", month: "short" });
    }

    function dayWeekday(lead, offset) {
      const date = dateFromStart(lead, offset);
      return date ? date.toLocaleDateString("en-IN", { weekday: "long" }) : "";
    }

    function generatedOverviewDays(lead, itinerary) {
      const stops = itinerary.routeStops?.length ? itinerary.routeStops : [];
      const days = Math.max(Number(lead.days || 1), 1);
      const dayRows = [];
      let current = itinerary.startLocation || "Guwahati";
      let dayIndex = 1;
      stops.forEach(stop => {
        const nights = Math.max(Number(stop.nights || 0), 0);
        if (!nights) return;
        dayRows.push({
          number: dayIndex,
          offset: dayIndex - 1,
          from: current,
          to: stop.location || current,
          stay: stop.location || current,
          drop: false,
          type: current === stop.location ? "Explore Day" : "Travel + Sightseeing"
        });
        dayIndex += 1;
        for (let extra = 1; extra < nights && dayIndex < days; extra += 1) {
          dayRows.push({
            number: dayIndex,
            offset: dayIndex - 1,
            from: stop.location || current,
            to: stop.location || current,
            stay: stop.location || current,
            drop: false,
            type: "Explore Day"
          });
          dayIndex += 1;
        }
        current = stop.location || current;
      });
      while (dayIndex < days) {
        dayRows.push({
          number: dayIndex,
          offset: dayIndex - 1,
          from: current,
          to: current,
          stay: current,
          drop: false,
          type: "Explore Day"
        });
        dayIndex += 1;
      }
      dayRows.push({
        number: days,
        offset: days - 1,
        from: current,
        to: itinerary.dropLocation || "Drop",
        stay: itinerary.dropLocation || current,
        drop: true,
        type: "Drop Day"
      });
      return dayRows.slice(0, days);
    }

    function sightseeingOptionsForDay(lead, day, itinerary = {}) {
      const towns = new Set([day.from, day.to, day.stay].filter(Boolean).map(item => String(item).trim().toLowerCase()));
      const destination = lead.destination || "";
      return allSightseeingItems(itinerary)
        .filter(item => towns.has(String(item.town || "").trim().toLowerCase()))
        .sort((a, b) => {
          const aDestinationMatch = destination && (itemDestinationMatches(a.destination, destination) ? 0 : 1);
          const bDestinationMatch = destination && (itemDestinationMatches(b.destination, destination) ? 0 : 1);
          return (aDestinationMatch - bDestinationMatch) || a.name.localeCompare(b.name);
        });
    }

    function itemDestinationMatches(itemDestination, itineraryDestination) {
      const itemText = String(itemDestination || "").toLowerCase();
      const itineraryText = String(itineraryDestination || "").toLowerCase();
      return itineraryText === "ne combo" || itineraryText.includes(itemText) || itemText.includes(itineraryText);
    }

    function allSightseeingItems(itinerary = {}) {
      const masterSightseeings = appState.masterData.sightseeings?.length ? appState.masterData.sightseeings : sightseeingMaster;
      return [
        ...masterSightseeings.map(normalizeSightseeingMasterItem).filter(item => item.active !== false),
        ...((itinerary.customSightseeing || []).map(item => ({ category: "Custom", ...item })))
      ];
    }

    function selectedSightseeingItems(ids = [], itinerary = {}) {
      const itemById = new Map(allSightseeingItems(itinerary).map(item => [item.id, item]));
      return ids.map(id => itemById.get(id)).filter(Boolean);
    }

    function hotelOptionsForLocation(location = "") {
      const search = String(location || "").trim().toLowerCase();
      return ensureMasterHotels().filter(item => item.active !== false && String(item.location || "").trim().toLowerCase() === search);
    }

    function hotelById(hotelId = "") {
      return ensureMasterHotels().find(item => item.id === hotelId) || null;
    }

    function findHotelByLabel(options = [], value = "") {
      const search = String(value || "").trim().toLowerCase();
      if (!search) return null;
      return options.find(item => `${item.name} - ${item.rating}`.toLowerCase() === search)
        || options.find(item => item.name.toLowerCase() === search)
        || options.find(item => `${item.name} - ${item.rating}`.toLowerCase().startsWith(search))
        || options.find(item => item.name.toLowerCase().startsWith(search))
        || null;
    }

    function formatIsoDate(date) {
      if (!date) return "";
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function hotelNightLabels(stay) {
      const nights = Math.max(Number(stay.nights || 0), 0);
      if (!stay.checkIn || !nights) return [];
      const start = new Date(stay.checkIn + "T00:00:00");
      return Array.from({ length: nights }, (_, index) => {
        const date = new Date(start);
        date.setDate(start.getDate() + index);
        return date.toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
      });
    }

    function datePlusNights(dateValue, nightsToAdd = 0) {
      if (!dateValue) return "";
      const date = new Date(dateValue + "T00:00:00");
      date.setDate(date.getDate() + Number(nightsToAdd || 0));
      return formatIsoDate(date);
    }

    function hotelNightDateRange(stay = {}, startOffset = 0, nights = 1) {
      const checkIn = datePlusNights(stay.checkIn, startOffset);
      const checkOut = datePlusNights(checkIn, nights);
      return { checkIn, checkOut };
    }

    function defaultHotelRoomRow(stay = {}, startNight = 1, nights = null) {
      const blockNights = Math.max(Number(nights ?? stay.nights ?? 1), 1);
      const range = hotelNightDateRange(stay, Math.max(Number(startNight || 1) - 1, 0), blockNights);
      return {
        id: uid(),
        startNight: Math.max(Number(startNight || 1), 1),
        nights: blockNights,
        roomMix: "",
        mealPlan: "Breakfast Included",
        extraQty: 0,
        extraType: "",
        checkIn: range.checkIn,
        checkOut: range.checkOut
      };
    }

    function normalizeHotelRoomRow(row = {}, stay = {}) {
      const startNight = Math.max(Number(row.startNight || row.nightNumber || row.night || 1), 1);
      const nights = Math.max(Number(row.nights || 1), 1);
      const range = hotelNightDateRange(stay, startNight - 1, nights);
      return {
        id: row.id || uid(),
        startNight,
        nights,
        roomMix: row.roomMix || row.roomType || "",
        mealPlan: row.mealPlan || "Breakfast Included",
        extraQty: Math.max(Number(row.extraQty || 0), 0),
        extraType: row.extraType || "",
        checkIn: range.checkIn,
        checkOut: range.checkOut
      };
    }

    function defaultHotelEntry(stay = {}) {
      return {
        id: uid(),
        hotelId: "",
        hotelSearchText: "",
        customHotelName: "",
        assignedNights: Math.max(Number(stay.nights || 1), 1),
        roomRows: [defaultHotelRoomRow(stay, 1, Math.max(Number(stay.nights || 1), 1))]
      };
    }

    function syncHotelRoomRows(entry = {}, stay = {}) {
      const assignedNights = Math.max(Number(entry.assignedNights || 0), 0);
      const existingRows = (Array.isArray(entry.roomRows) && entry.roomRows.length ? entry.roomRows : [defaultHotelRoomRow(stay, 1, assignedNights)])
        .map(row => ({ ...row }));
      const rows = [];
      let cursor = 1;
      let remaining = assignedNights;
      while (remaining > 0) {
        const source = existingRows[rows.length] || {};
        const requestedNights = Math.max(Number(source.nights || 0), 0);
        const nights = Math.min(requestedNights || remaining, remaining);
        rows.push(normalizeHotelRoomRow({ ...source, startNight: cursor, nights }, stay));
        cursor += nights;
        remaining -= nights;
      }
      return rows;
    }

    function normalizeHotelEntry(entry = {}, stay = {}) {
      const assignedNights = Math.max(Number(entry.assignedNights || (stay.nights || 1)), 0);
      return {
        id: entry.id || uid(),
        hotelId: entry.hotelId || "",
        hotelSearchText: entry.hotelSearchText || (entry.hotelId ? `${hotelById(entry.hotelId)?.name || ""}${hotelById(entry.hotelId)?.rating ? ` - ${hotelById(entry.hotelId).rating}` : ""}`.trim() : ""),
        customHotelName: entry.customHotelName || "",
        assignedNights,
        roomRows: syncHotelRoomRows({ ...entry, assignedNights }, stay)
      };
    }

    function hotelEntriesTotalNights(stay = {}) {
      return (stay.hotels || []).reduce((sum, entry) => sum + Math.max(Number(entry.assignedNights || 0), 0), 0);
    }

    function hotelStayValidation(stay = {}) {
      if ((stay.hotelMode || "split") === "parallel") {
        return {
          total: hotelEntriesTotalNights(stay),
          expected: Math.max(Number(stay.nights || 0), 0),
          valid: true
        };
      }
      const total = hotelEntriesTotalNights(stay);
      const expected = Math.max(Number(stay.nights || 0), 0);
      return {
        total,
        expected,
        valid: total === expected
      };
    }

    function hotelEntryRange(stay = {}, hotelIndex = 0) {
      if ((stay.hotelMode || "split") === "parallel") {
        const currentNights = Math.max(Number(stay.hotels?.[hotelIndex]?.assignedNights || stay.nights || 0), 0);
        const checkIn = stay.checkIn || "";
        const checkOut = datePlusNights(checkIn, currentNights);
        return { checkIn, checkOut, nights: currentNights };
      }
      const hotels = stay.hotels || [];
      const beforeNights = hotels.slice(0, hotelIndex).reduce((sum, entry) => sum + Math.max(Number(entry.assignedNights || 0), 0), 0);
      const currentNights = Math.max(Number(hotels[hotelIndex]?.assignedNights || 0), 0);
      const checkIn = datePlusNights(stay.checkIn, beforeNights);
      const checkOut = datePlusNights(checkIn, currentNights);
      return { checkIn, checkOut, nights: currentNights };
    }

    function applyHotelEntryRange(stay = {}, hotelIndex = 0, entry = {}) {
      const range = hotelEntryRange({ ...stay, hotels: stay.hotels || [] }, hotelIndex);
      const scopedStay = {
        ...stay,
        checkIn: range.checkIn,
        checkOut: range.checkOut,
        nights: range.nights
      };
      return {
        ...normalizeHotelEntry(entry, scopedStay),
        checkIn: range.checkIn,
        checkOut: range.checkOut
      };
    }

    function generatedHotelStays(lead, itinerary) {
      const stops = itinerary.routeStops?.length
        ? itinerary.routeStops.filter(stop => Number(stop.nights || 0) > 0)
        : [{ location: itinerary.startLocation || "Guwahati", nights: Math.max(Number(lead.days || 1) - 1, 0) }];
      const startDate = lead.startDate ? new Date(lead.startDate + "T00:00:00") : null;
      let offset = 0;
      return stops.map((stop, index) => {
        const checkIn = startDate ? new Date(startDate) : null;
        if (checkIn) checkIn.setDate(startDate.getDate() + offset);
        const checkOut = checkIn ? new Date(checkIn) : null;
        if (checkOut) checkOut.setDate(checkIn.getDate() + Number(stop.nights || 0));
        const stay = {
          routeIndex: index,
          location: stop.location || "",
          nights: Number(stop.nights || 0),
          checkIn: formatIsoDate(checkIn),
          checkOut: formatIsoDate(checkOut)
        };
        offset += Number(stop.nights || 0);
        return stay;
      });
    }

    function ensureHotelDetails(lead, itinerary) {
      const generated = generatedHotelStays(lead, itinerary);
      const existing = Array.isArray(itinerary.hotelDetails) ? itinerary.hotelDetails : [];
      return generated.map(stay => {
        const match = existing.find(item => Number(item.routeIndex) === stay.routeIndex && String(item.location || "") === stay.location) || {};
        const legacyHotel = (match.hotelId || match.customHotelName || match.roomType || match.mealPlan || match.roomNote)
          ? {
            id: uid(),
            hotelId: match.hotelId || "",
            hotelSearchText: match.hotelId ? `${hotelById(match.hotelId)?.name || ""}${hotelById(match.hotelId)?.rating ? ` - ${hotelById(match.hotelId).rating}` : ""}`.trim() : "",
            customHotelName: match.customHotelName || "",
            assignedNights: Math.max(Number(stay.nights || 1), 1),
            roomRows: [{
              id: uid(),
              startNight: 1,
              nights: Math.max(Number(stay.nights || 1), 1),
              roomMix: match.roomType || "",
              mealPlan: match.mealPlan || "Breakfast Included",
              extraQty: 0,
              extraType: "",
              checkIn: stay.checkIn,
              checkOut: datePlusNights(stay.checkIn, Math.max(Number(stay.nights || 1), 1))
            }]
          }
          : null;
        let entries = Array.isArray(match.hotels) && match.hotels.length
          ? match.hotels.map(entry => normalizeHotelEntry(entry, stay))
          : [normalizeHotelEntry(legacyHotel || defaultHotelEntry(stay), stay)];
        entries = entries.map((entry, hotelIndex) => applyHotelEntryRange({ ...stay, hotels: entries }, hotelIndex, entry));
        return {
          id: match.id || uid(),
          routeIndex: stay.routeIndex,
          location: stay.location,
          nights: stay.nights,
          checkIn: stay.checkIn,
          checkOut: stay.checkOut,
          hotelMode: match.hotelMode || "split",
          hotels: entries
        };
      });
    }

    function hotelDisplayName(entry) {
      return entry.customHotelName || hotelById(entry.hotelId)?.name || "Hotel to be confirmed";
    }

    function hotelStarCount(rating = "") {
      const match = String(rating || "").match(/(\d+)/);
      return match ? Math.max(0, Math.min(5, Number(match[1]))) : 0;
    }

    function ordinalNightLabel(number) {
      const value = Number(number || 0);
      if (value === 1) return "1st Night";
      if (value === 2) return "2nd Night";
      if (value === 3) return "3rd Night";
      return `${value}th Night`;
    }

    function resolveHeroImage(itinerary = {}) {
      const settingsHero = appState.masterData?.settings?.defaultHeroImage || "";
      return itinerary.heroImage || settingsHero || cachedDefaultHeroDataUrl || "assets/default-hero.jpg";
    }

    function hotelImageUrl(filename = "") {
      if (!filename) return "";
      if (BUILTIN_HOTEL_IMAGE_DATA[filename]) return BUILTIN_HOTEL_IMAGE_DATA[filename];
      const safe = filename.split("/").map(part => encodeURIComponent(part)).join("/");
      return `assets/reify_hotels/${safe}`;
    }

    function findSightseeingByName(options = [], value = "") {
      const search = String(value || "").trim().toLowerCase();
      if (!search) return null;
      return options.find(item => item.name.toLowerCase() === search) || options.find(item => item.name.toLowerCase().startsWith(search)) || null;
    }

    function exactSightseeingByName(options = [], value = "") {
      const search = String(value || "").trim().toLowerCase();
      if (!search) return null;
      return options.find(item => item.name.toLowerCase() === search) || null;
    }

    function overviewSlotRows(lead, itinerary, dayNumber, slotIndex, value, exactOnly = false) {
      const day = generatedOverviewDays(lead, itinerary).find(item => Number(item.number) === Number(dayNumber)) || {};
      const options = sightseeingOptionsForDay(lead, day, itinerary);
      const matched = exactOnly ? exactSightseeingByName(options, value) : findSightseeingByName(options, value);
      if (String(value || "").trim() && !matched) return null;
      return overviewRowsWithSightseeing(lead, itinerary, dayNumber, (currentIds, currentDay, saved) => {
        const ids = [...currentIds];
        if (matched) {
          const duplicateIndex = ids.indexOf(matched.id);
          if (duplicateIndex >= 0 && duplicateIndex !== Number(slotIndex)) ids.splice(duplicateIndex, 1);
          ids[slotIndex] = matched.id;
        } else {
          ids.splice(slotIndex, 1);
        }
        return {
          sightseeingIds: ids.filter(Boolean),
          sightSlotCount: Math.max(Number(saved.sightSlotCount || 0), 9, Number(slotIndex) + 1)
        };
      });
    }

    function overviewRowsWithSightseeing(lead, itinerary, dayNumber, updater) {
      const generated = generatedOverviewDays(lead, itinerary);
      const existingRows = itinerary.overviewDays || [];
      return generated.map(day => {
        const saved = existingRows.find(item => Number(item.number) === day.number) || {};
        const currentIds = saved.sightseeingIds || [];
        if (Number(day.number) !== Number(dayNumber)) return { ...day, ...saved, sightseeingIds: currentIds };
        const result = updater(currentIds, day, saved);
        const patch = Array.isArray(result) ? { sightseeingIds: result } : result;
        return { ...day, ...saved, ...patch };
      });
    }

    function noteForPreset(preset) {
      if (preset === "Payment") return appState.masterData.settings.paymentNote;
      if (preset === "Review") return appState.masterData.settings.reviewNote;
      return "";
    }

    function defaultDayPlanStart(type = "") {
      if (type === "Pick Up Only") return "";
      if (type === "Drop Only") return "";
      if (type === "Explore Day") return "08:30";
      if (type === "Drop Day") return "08:00";
      if (type === "Travel Day") return "07:30";
      return "07:00";
    }

    function defaultDayPlanIntro(day = {}, selected = []) {
      if (day.drop) {
        return `After breakfast, proceed from ${day.from} towards ${day.to || day.stay} for your onward journey.`;
      }
      if (day.type === "Explore Day") {
        return `Spend the day exploring ${day.stay} at a comfortable pace, covering the planned highlights and local experiences.`;
      }
      if (day.type === "Travel Day") {
        return `Travel from ${day.from} to ${day.to}, enjoying the changing landscapes and planned halts along the way.`;
      }
      if (selected.length) {
        return `Begin your journey from ${day.from} towards ${day.to}, covering the planned sightseeing stops before settling into ${day.stay} for the night.`;
      }
      return `Proceed from ${day.from} to ${day.to}, with a relaxed travel flow before checking in at ${day.stay}.`;
    }

    function ensureDayPlanDetails(lead, itinerary) {
      const generated = generatedOverviewDays(lead, itinerary);
      const existing = Array.isArray(itinerary.dayPlanDetails) ? itinerary.dayPlanDetails : [];
      const overviewRows = itinerary.overviewDays || [];
      return generated.map(day => {
        const overview = overviewRows.find(item => Number(item.number) === day.number) || {};
        const selected = selectedSightseeingItems(overview.sightseeingIds || [], itinerary);
        const match = existing.find(item => Number(item.number) === day.number) || {};
        return {
          number: day.number,
          suggestedStart: match.suggestedStart || defaultDayPlanStart(overview.type || day.type),
          intro: match.intro || defaultDayPlanIntro({ ...day, ...overview }, selected),
          note: match.note || ""
        };
      });
    }

    function escapeAttr(value = "") {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeHtml(value = "") {
      return escapeAttr(value);
    }

    function fillLeadForm(lead) {
      const form = document.getElementById("leadForm");
      form.reset();
      form.dataset.editId = lead.id || "";
      form.dataset.createdAt = lead.createdAt || "";
      Object.entries(lead).forEach(([key, value]) => {
        const field = form.elements[key];
        if (field) field.value = value;
      });
      form.elements.endDate.value = addDays(form.elements.startDate.value, form.elements.days.value);
    }

    function parseInquiryText(text) {
      const parts = text.split("|").map(part => part.trim());
      const [source, name, phone, email, pax, tripDate, days, message] = parts;
      const adults = (pax || "").match(/(\d+)\s*(adult|pax|people)?/i)?.[1] || "";
      return {
        source: source || "Adword-E-NE",
        displayName: name ? `Mr. ${name.replace(/^(mr\.|ms\.|dr\.)\s*/i, "")}` : "",
        mobile: phone || "",
        email: email || "",
        adults: adults || 2,
        startDate: normalizeDate(tripDate),
        days: Number((days || "").match(/\d+/)?.[0] || 6),
        remarks: message || ""
      };
    }

    function normalizeDate(value) {
      if (!value) return "";
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return "";
      return parsed.toISOString().slice(0, 10);
    }

    function renderEditorTabs() {
      const tabs = document.getElementById("editorTabs");
      tabs.innerHTML = editorTabNames.map((name, index) => `<button class="editor-tab ${index === activeEditorTab ? "active" : ""}" data-editor-tab="${index}">${name}</button>`).join("");
      renderEditorVersionBar(selectedLead());
      renderEditorPane(activeEditorTab);
    }

    function renderEditorPane(index) {
      activeEditorTab = index;
      const lead = selectedLead();
      const panes = document.getElementById("editorPanes");
      renderEditorVersionBar(lead);
      if (!lead) {
        panes.innerHTML = `<div class="data-empty">Select a lead first.</div>`;
        return;
      }
      const itinerary = ensureItinerary(lead);
      const locked = isViewingLockedItineraryVersion(lead);
      document.querySelectorAll(".editor-tab").forEach((tab, tabIndex) => tab.classList.toggle("active", tabIndex === index));
      renderMobileOutput();
      try {
        if (index === 0) renderCostCalculatorPane(lead, itinerary, panes);
        else if (index === 1) renderIntroCostPane(lead, itinerary, panes);
        else if (index === 2) renderAboutTripPane(lead, itinerary, panes);
        else if (index === 3) renderCabDetailsPane(lead, itinerary, panes);
        else if (index === 4) renderItineraryOverviewPane(lead, itinerary, panes);
        else if (index === 5) renderHotelDetailsPane(lead, itinerary, panes);
        else if (index === 6) renderInclusionsPane(lead, itinerary, panes);
        else if (index === 7) renderGoodToKnowPane(lead, itinerary, panes);
        else renderPlaceholderPane(lead, index, panes);
        applyEditorReadOnlyState(panes, locked);
      } catch (error) {
        console.error(`Editor tab ${index} failed to render`, error);
        panes.innerHTML = `
          <div class="editor-pane active">
            <div class="validation-warning" style="font-weight:700">
              This tab could not be opened. ${escapeHtml(error?.message || "Unknown error")}
            </div>
          </div>
        `;
      }
    }

      holder.innerHTML = masterTabNames.map((name, index) => `<button class="editor-tab ${index === activeMasterTab ? "active" : ""}" data-master-tab="${index}">${name}</button>`).join("");
      renderMasterPane(activeMasterTab);

      if (index === 4) return renderCabTypesMasterPane(pane);

    function renderDashboard() {
      const month = new Date().getMonth();
      const year = new Date().getFullYear();
      const monthLeads = appState.leads.filter(lead => {
        const date = new Date(lead.createdAt);
        return date.getMonth() === month && date.getFullYear() === year;
      });
      const converted = monthLeads.filter(lead => lead.temperature === "converted").length;
      const rate = monthLeads.length ? Math.round((converted / monthLeads.length) * 100) : 0;
      const cards = [
        ["Leads this month", monthLeads.length],
        ["Converted this month", converted],
        ["Conversion rate", `${rate}%`]
      ];
      document.getElementById("dashboardCards").innerHTML = cards.map(([label, value]) => `
        <div class="panel">
          <p class="muted">${label}</p>
          <h2>${value}</h2>
        </div>
      `).join("");
    }

    function renderMobileOutput(mode = "tab") {
      const lead = selectedLead();
      const output = document.getElementById("mobileOutput");
      if (!lead) {
        output.innerHTML = `<div class="output-section"><h2>No lead selected</h2><p class="muted">Open a lead to generate the customer-facing mobile itinerary.</p></div>`;
        return;
      }
      const itinerary = ensureItinerary(lead);
      const familyTotal = (itinerary.familyRows || []).reduce((sum, row) => sum + Number(row.amount || 0), 0);
      const total = itinerary.costMode === "Per Family" ? familyTotal : Number(itinerary.costAmount || lead.packageCost || 0);
      const paxAdults = Number(itinerary.paxAdults ?? lead.adults ?? 0);
      const paxChildren = Number(itinerary.paxChildren ?? lead.children ?? 0);
      const paxChildAges = itinerary.paxChildAges ?? lead.childAges ?? "";
      const paxText = formatPax(paxAdults, paxChildren, paxChildAges);
      const perPerson = paxAdults ? Math.round(total / paxAdults) : total;
      const sampleDays = buildSampleDays(lead);
      const destination = itinerary.destinationOverride || lead.destination || "Northeast India";
      const heroImage = resolveHeroImage(itinerary);
      const introSection = `

              <p class="hero-kicker">Crafted just for you</p>
              <div class="hero-name-row">
                <h2>${lead.displayName || "Dear Guest"}</h2>
              </div>
              <span class="hero-pax">${paxText}</span>
              <span class="hero-duration">${lead.days || 0} days</span>
            </div>
            <div class="hero-trip-block">
              <div class="trip-prefix">Your trip to</div>
              <div class="destination">${destination}</div>
              <div class="trip-suffix">is ready</div>
            </div>
            <p>${lead.days || 0} days &middot; ${paxText}</p>
          </div>
        </section>
        <section class="output-section">
          <h2>Welcome</h2>
          <p>We have shaped this journey around comfort, route flow, local experiences and enough breathing room between travel days.</p>
          ${renderCostCard(lead, itinerary, total, perPerson)}
          <p class="muted">${itinerary.note || appState.masterData.settings.reviewNote}</p>
        </section>
      `;
      const aboutSection = renderAboutSection(lead, itinerary);
      const cabSection = renderCabSection(lead, itinerary);
      const overviewSection = renderOverviewSection(lead, itinerary, destination);
      const hotelSection = renderHotelSection(lead, itinerary);
      const inclusionSection = renderInclusionsSection(lead, itinerary);
      const goodToKnowSection = renderGoodToKnowSection(lead, itinerary);
      const tabPreviews = {
        0: `<section class="output-section"><h2>Cost Calculator</h2><p class="muted">Internal calculation sheet only. This section will not appear in the customer PDF.</p></section>`,
        1: introSection,
        2: aboutSection,
        3: cabSection,
        4: overviewSection,
        5: hotelSection,
        6: inclusionSection,
        7: goodToKnowSection,
        8: `<section class="output-section"><h2>Invoice</h2><p class="muted">Invoice preview will appear here when this module is built.</p></section>`
      };
      output.innerHTML = mode === "full"
        ? `${introSection}${aboutSection}${cabSection}${overviewSection}${hotelSection}${inclusionSection}${goodToKnowSection}`
        : (tabPreviews[activeEditorTab] || introSection);
