    function moneyOrNotSet(value) {
      const amount = Number(value || 0);
      return amount > 0 ? `Rs. ${amount.toLocaleString("en-IN")}` : "Not set";
    }

    function formatStackedMoney(value) {
      const amount = Number(value || 0);
      return amount > 0 ? `<span class="currency">Rs.</span>${amount.toLocaleString("en-IN")}` : "Not set";
    }

    function renderAboutSection(lead, itinerary) {
      const stops = itinerary.routeStops?.length
        ? itinerary.routeStops
        : [{ location: itinerary.startLocation || "Guwahati", nights: Math.max(Number(lead.days || 1) - 1, 0) }];
      const filled = routeNightsTotal(stops);
      const required = Math.max(Number(lead.days || 1) - 1, 0);
      const inclusions = inclusionLabels(itinerary.inclusions);
      const startDate = lead.startDate ? new Date(lead.startDate + "T00:00:00") : null;
      const addDate = offset => {
        if (!startDate) return "";
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + offset);
        return date;
      };
      const shortDate = date => date ? date.toLocaleDateString("en-IN", { day: "2-digit", month: "short" }) : "";
      const fullDate = date => date ? date.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "";
      let nightOffset = 0;
      const routeRows = stops.map((stop, index) => {
        const firstNight = addDate(nightOffset);
        const lastNight = addDate(nightOffset + Number(stop.nights || 0) - 1);
        const stayText = Number(stop.nights || 0) > 1
          ? `${shortDate(firstNight)} & ${shortDate(lastNight)}`
          : shortDate(firstNight);
        nightOffset += Number(stop.nights || 0);
        return { ...stop, number: index + 1, stayText };
      });
      return `
        <section class="output-section">
          <h2>About the Trip</h2>
          <div class="about-title-rule"></div>
          <div class="duration-pill">
            <span>Duration</span>
            <strong>${lead.days || 0} days / ${required} nights</strong>
          </div>
          <div class="trip-summary-grid">
            <div class="trip-summary-card"><span>Start</span><strong>${formatDate(lead.startDate)}</strong><p class="muted" style="margin:4px 0 0">${weekday(lead.startDate)}</p></div>
            <div class="date-connector"></div>
            <div class="trip-summary-card"><span>End</span><strong>${formatDate(calculatedEndDate(lead))}</strong><p class="muted" style="margin:4px 0 0">${weekday(calculatedEndDate(lead))}</p></div>
          </div>
          ${inclusions.length ? `
            <div>
              <div class="cost-label" style="margin-bottom:10px">Package Inclusions</div>
              <div class="inclusion-row">
                ${inclusions.map(item => `
                  <div class="inclusion-card">
                    <strong>${item.title}</strong>
                    <p>${item.text}</p>
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ""}
          <div class="about-route">
            <div class="cost-label" style="margin-bottom:4px">Night Wise Breakdown</div>
            <div class="about-route-item featured">
              <div class="route-number terminal">S</div>
              <div><div class="route-location">${itinerary.startLocation || "Guwahati"}</div><p class="route-meta">Trip Starts on - ${fullDate(startDate)}</p></div>
              <div class="route-tag">Start</div>
            </div>
            ${routeRows.map(stop => `
              <div class="about-route-item">
                <div class="route-number">${stop.number}</div>
                <div><div class="route-location">${stop.location || "Not set"}</div><p class="route-meta">Stay - ${stop.stayText || "Date not set"}</p></div>
                <div class="route-night-count">${String(Number(stop.nights || 0)).padStart(2, "0")} Night${Number(stop.nights || 0) === 1 ? "" : "s"}</div>
              </div>
            `).join("")}
            <div class="about-route-item featured">
              <div class="route-number terminal">D</div>
              <div><div class="route-location">${itinerary.dropLocation || "Guwahati"}</div><p class="route-meta">Journey concludes - ${fullDate(addDate(Number(lead.days || 1) - 1))}</p></div>
              <div class="route-tag">Drop</div>
            </div>
          </div>
          ${filled !== required ? `<p class="muted">Route nights are ${filled} of ${required}. Please finalize this before sharing.</p>` : ""}
        </section>
      `;
    }

    function renderCabSection(lead, itinerary) {
      const cabs = ensureCabDetails(lead, itinerary);
      let commonTerms = normalizeCabTerms(itinerary.cabTerms?.length ? itinerary.cabTerms : appState.masterData.settings.defaultCabTerms);
      const commonTermsJoined = commonTerms.join(" ").toLowerCase();
      if (commonTermsJoined.includes("parking, tolls and permits") || commonTermsJoined.includes("vehicle change may happen")) {
        commonTerms = [...appState.masterData.settings.defaultCabTerms];
        itinerary.cabTerms = [...commonTerms];
      }
      const hasTransferOnly = cabs.some(cab => cab.coverage === "For Transfer only");
      const hasMainTripCab = cabs.some(cab => ["For all sightseeing", "For Transfers and sightseeing"].includes(cab.coverage));
      let transitionShown = false;
      const cabGroups = groupCabsBySegment(cabs);
      return `
        <section class="output-section">
          <div>
            <div class="cost-label" style="margin-bottom:8px">Travel Support For Your Journey</div>
            <h2>Cab Details</h2>
            <div class="about-title-rule"></div>
          </div>
          ${cabGroups.map(group => {
            const statement = group.coverage === "For Transfer only"
              ? "Cab is for transfers only."
              : `Cab is on ${String(group.useBasis || "Disposal Basis").toLowerCase()}.`;
            const pickupValues = group.cabs.map(cab => String(cab.pickupPoint || "Guwahati Airport").trim() || "Guwahati Airport");
            const sharedPickup = pickupValues.length && pickupValues.every(value => value === pickupValues[0]) ? pickupValues[0] : "";
            const acLabel = group.cabs[0]?.acType || "Private AC";
            const cabTypeLines = group.cabs.map((cab, idx) => `${idx > 0 ? `<span style="display:block;font-size:18px;color:var(--teal);margin:6px 0">+</span>` : ""}${escapeHtml(cab.cabType || "Cab")}`).join("");
            const qtyLines = group.cabs.map((cab, idx) => {
              const qty = Number(cab.quantity || 1);
              const label = `${String(qty).padStart(2, "0")} Cab${qty === 1 ? "" : "s"}`;
              return `${idx > 0 ? `<span style="display:block;height:18px"></span>` : ""}${label}`;
            }).join("");
            const pickupLines = pickupValues.map((value, idx) => `${idx > 0 ? `<span style="display:block;height:18px"></span>` : ""}${escapeHtml(value)}`).join("");
            const sharedVehicleRows = group.cabs.map((cab, idx) => {
              const qty = Number(cab.quantity || 1);
              const qtyLabel = `${String(qty).padStart(2, "0")} Cab${qty === 1 ? "" : "s"}`;
              return `
                <div class="cab-shared-row">
                  <div class="cab-shared-cell"><strong>${escapeHtml(cab.cabType || "Cab")}</strong></div>
                  <div class="cab-shared-cell qty"><strong>${qtyLabel}</strong></div>
                </div>
                ${idx < group.cabs.length - 1 ? `<div class="cab-shared-separator"><span>+</span></div>` : ""}
              `;
            }).join("");
            return `
              <div class="cab-preview-group">
                <div class="cab-group-head">
                  <div class="cost-label">${group.segment}</div>
                  <div class="cab-date-badge">${group.coverage || "For all sightseeing"}</div>
                </div>
                <div class="cab-card">
                  ${sharedPickup ? `
                    <div class="cab-start-band">
                      <span>Starts From</span>
                      <strong>${escapeHtml(sharedPickup)}</strong>
                    </div>
                  ` : ""}
                  ${sharedPickup ? `
                    <div class="cab-shared-grid">
                      <div class="cab-shared-head">${acLabel}</div>
                      <div class="cab-shared-head qty">Qty</div>
                      ${sharedVehicleRows}
                    </div>
                  ` : `
                    <div class="cab-card-grid">
                      <div class="cab-cell">
                        <span>${acLabel}</span>
                        <strong>${cabTypeLines}</strong>
                      </div>
                      <div class="cab-cell">
                        <span>Qty</span>
                        <strong>${qtyLines}</strong>
                      </div>
                      <div class="cab-cell">
                        <span>${(group.segment || "").toLowerCase().includes("trip") ? "Starts From" : "Pickup Point"}</span>
                        <strong>${pickupLines}</strong>
                      </div>
                    </div>
                  `}
                  <ul class="cab-notes">
                    <li>${statement}</li>
                    ${group.cabs.map(cab => cab.note ? `<li>${escapeHtml(cab.note)}</li>` : "").join("")}
                  </ul>
                </div>
              </div>
              ${hasTransferOnly && hasMainTripCab && group.coverage === "For Transfer only" && !transitionShown ? (() => {
                transitionShown = true;
                return `<div class="cab-transition">Transfer-only vehicle is arranged only for the mentioned pickup/drop. Your sightseeing vehicle is shown separately.</div>`;
              })() : ""}
            `;
          }).join("")}
          <div class="cab-terms">
            <span>Cab Terms</span>
            ${commonTerms.map(term => `<div class="cab-term-row">${term}</div>`).join("")}
          </div>
        </section>
      `;
    }

    function buildSampleDays(lead) {

        ? ["Guwahati", "Shillong", "Cherrapunjee", "Shillong", "Guwahati"]

      return Array.from({ length: Math.min(days, 5) }, (_, index) => {
        const date = new Date(start);

    async function imageElementToDataUrl(url, sourceImage = null) {
      const absolute = new URL(url, window.location.href).href;
      return await new Promise((resolve, reject) => {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = image.naturalWidth || image.width || 1;
            canvas.height = image.naturalHeight || image.height || 1;
            const context = canvas.getContext("2d");
            context.drawImage(image, 0, 0);
            resolve(canvas.toDataURL("image/png"));
          } catch (error) {
            reject(error);
          }
        };
        image.onerror = reject;
        image.src = absolute;
      });
    }

    async function urlToDataUrl(url, sourceImage = null) {
      if (!url || url.startsWith("data:")) return url;
      const absolute = new URL(url, window.location.href).href;
      try {
        const response = await fetch(absolute, { cache: "force-cache" });
        const blob = await response.blob();
        return await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      } catch (fetchError) {
        return await imageElementToDataUrl(absolute, sourceImage);
      }
    }

    function backgroundUrlFromElement(element) {
      const inlineBackground = element.style.background || element.style.backgroundImage || "";
      const computedBackground = window.getComputedStyle(element).backgroundImage || "";
      const source = inlineBackground.includes("url(") ? inlineBackground : computedBackground;
      const match = source.match(/url\(["']?([^"')]+)["']?\)/);
      return match?.[1] || "";
    }

    async function inlinePdfImages(root) {
      const restore = [];
      const images = [...root.querySelectorAll("img")];
      await Promise.all(images.map(async image => {
        const current = image.getAttribute("src") || "";
        if (!current || current.startsWith("data:")) return;
        try {
          const dataUrl = await urlToDataUrl(current, image);
          restore.push(() => image.setAttribute("src", current));
          image.setAttribute("src", dataUrl);
        } catch (error) {
          console.warn("Could not inline image for PDF", current, error);
          restore.push(() => image.setAttribute("src", current));
          image.removeAttribute("src");
        }
      }));
      const backgroundTargets = [root, ...root.querySelectorAll("*")].filter(element => backgroundUrlFromElement(element));
      await Promise.all(backgroundTargets.map(async element => {
        const currentUrl = backgroundUrlFromElement(element);
        if (!currentUrl || currentUrl.startsWith("data:")) return;
        const inlineBackground = element.style.background;
        const inlineBackgroundImage = element.style.backgroundImage;
        try {
          const dataUrl = await urlToDataUrl(currentUrl);
          restore.push(() => {
            element.style.background = inlineBackground;
            element.style.backgroundImage = inlineBackgroundImage;
          });
          if (element.style.background && element.style.background.includes(currentUrl)) {
            element.style.background = element.style.background.replace(currentUrl, dataUrl);
          } else {
            element.style.backgroundImage = `url("${dataUrl}")`;
          }
        } catch (error) {
          console.warn("Could not inline background for PDF", currentUrl, error);
        }
      }));
      await Promise.all(images.map(image => image.decode?.().catch(() => {}) || Promise.resolve()));
      return () => restore.reverse().forEach(fn => fn());
    }

    async function ensureDefaultHeroDataUrl() {
      const settingsHero = appState.masterData?.settings?.defaultHeroImage || "";

      if (BUILTIN_DEFAULT_HERO_DATA_URL) {
        cachedDefaultHeroDataUrl = BUILTIN_DEFAULT_HERO_DATA_URL;
        return cachedDefaultHeroDataUrl;
      }
      try {
        cachedDefaultHeroDataUrl = await urlToDataUrl("assets/default-hero.jpg");
      } catch (error) {
        console.warn("Could not inline default hero image", error);
      }
      return cachedDefaultHeroDataUrl;
    }

    async function waitForRenderableImages(root, timeoutMs = 5000) {
      const images = [...root.querySelectorAll("img")].filter(image => {
        const src = image.getAttribute("src") || "";
        return Boolean(src);
      });
      await Promise.all(images.map(image => new Promise(resolve => {
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          cleanup();
          const decoded = image.decode?.().catch(() => {}) || Promise.resolve();
          decoded.finally(resolve);
        };
        const cleanup = () => {
          clearTimeout(timer);
          image.removeEventListener("load", finish);
          image.removeEventListener("error", finish);
        };
        const timer = setTimeout(finish, timeoutMs);
        if (image.complete && image.naturalWidth > 0) {
          finish();
          return;
        }
        image.addEventListener("load", finish, { once: true });
        image.addEventListener("error", finish, { once: true });
      })));
    }

    async function captureItineraryCanvas(output) {
      await ensureDefaultHeroDataUrl();
      renderMobileOutput("full");
      await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 60)));
      await waitForRenderableImages(output);
      const restorePdfImages = await inlinePdfImages(output);
      await waitForRenderableImages(output);
      await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 60)));
      const canvas = await window.html2canvas(output, {
        backgroundColor: "#f8f6f1",
        scale: 2,
        useCORS: true,
        allowTaint: false,
        width: 390,
        height: output.scrollHeight,
        windowWidth: 1280,
        windowHeight: output.scrollHeight
      });
      return { canvas, restorePdfImages };
    }

    async function downloadLongMobilePdf() {
      const lead = selectedLead();
      renderMobileOutput("full");
      await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 120)));
      const output = document.getElementById("mobileOutput");
      const preview = output.closest(".phone-preview");
      const previousPreviewOverflow = preview.style.overflow;
      const previousOutputWidth = output.style.width;
      let restorePdfImages = () => {};
      preview.style.overflow = "visible";
      output.style.width = "390px";
      try {
        if (!window.html2canvas || !window.jspdf?.jsPDF) {
          alert("PDF export libraries are missing. Please keep the vendor folder with this builder.");
          return;
        }
        const capture = await captureItineraryCanvas(output);
        restorePdfImages = capture.restorePdfImages;
        const canvas = capture.canvas;
        const pdfWidth = 211.44;
        const pdfHeight = Math.max(600, pdfWidth * (canvas.height / canvas.width));
        const pdf = new window.jspdf.jsPDF({
          orientation: "portrait",
          unit: "pt",
          format: [pdfWidth, pdfHeight],
          compress: true
        });
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.94), "JPEG", 0, 0, pdfWidth, pdfHeight);
        const filename = `${(lead?.displayName || "Reify Itinerary").replace(/[^\w\s-]/g, "").trim() || "Reify Itinerary"} - Mobile Itinerary.pdf`;
        pdf.save(filename);
      } catch (error) {
        console.error(error);
        alert(`Long PDF export failed: ${error?.message || error}. If a custom image was uploaded, try re-uploading it or use Customer PDF or Download Long PDF as backup.`);
      } finally {
        restorePdfImages();
        preview.style.overflow = previousPreviewOverflow;
        output.style.width = previousOutputWidth;
        renderMobileOutput();
      }
    }

          }
        });

        const cabs = ensureCabDetails(lead, itinerary);
        const key = target.dataset.cabSegmentKey;
        const field = target.dataset.cabSegmentField;
        const value = target.value;
        const updated = cabs.map(cab => {
          if (cabSegmentKey(cab) !== key) return cab;
          const next = { ...cab, [field]: value };
          if (field === "coverage" && value === "For Transfer only") next.useBasis = "Transfers Only";
          if (field === "coverage" && value !== "For Transfer only" && (!next.useBasis || next.useBasis === "Transfers Only")) next.useBasis = "Disposal Basis";
          return next;
        });
        saveItineraryPatch({ cabDetails: updated });
        return;
      }
      if (target.matches("[data-cab-vehicle-field]")) {
        const cabs = ensureCabDetails(lead, itinerary);
        const id = target.dataset.cabId;
        const field = target.dataset.cabVehicleField;
        const value = target.type === "number" ? Number(target.value || 0) : target.value;
        const updated = cabs.map(cab => {
          if (cab.id !== id) return cab;
          const next = { ...cab, [field]: value };
          if (field === "cabType") next.note = cabSpecificNote(value);
          return next;
        });
        saveItineraryPatch({ cabDetails: updated });
        return;

        saveItineraryPatch({ cabTerms: target.value.split("\n").map(item => item.trim()).filter(Boolean) });

        const field = target.dataset.hotelEntryField;
        const value = field === "assignedNights" ? Math.max(Number(target.value || 0), 0) : target.value;
        const hotels = [...(stays[stayIndex]?.hotels || [])];
        const updatedEntry = { ...(hotels[hotelIndex] || defaultHotelEntry(stays[stayIndex])), [field]: value };
        if ((stays[stayIndex]?.hotelMode || "split") === "parallel" && field === "assignedNights") {
          updatedEntry.assignedNights = Math.min(updatedEntry.assignedNights, Math.max(Number(stays[stayIndex]?.nights || 0), 0));
        }
        hotels[hotelIndex] = applyHotelEntryRange({ ...(stays[stayIndex] || {}), hotels }, hotelIndex, updatedEntry);

        const hotelMode = target.value || "split";
        let hotels = [...(currentStay.hotels || [])];
        if (hotelMode === "parallel") {
          hotels = hotels.map(entry => ({
            ...(entry || defaultHotelEntry(currentStay)),
            assignedNights: Math.max(Number(currentStay.nights || 0), 0)
          }));
        } else {
          const expected = Math.max(Number(currentStay.nights || 0), 0);
          let remaining = expected;
          hotels = hotels.map((entry, index) => {
            const isLast = index === hotels.length - 1;
            const requested = Math.max(Number(entry.assignedNights || 0), 0);
            const assignedNights = isLast ? remaining : Math.min(requested || remaining, remaining);
            remaining = Math.max(remaining - assignedNights, 0);
            return { ...(entry || defaultHotelEntry(currentStay)), assignedNights };
          });
        }
        stays[stayIndex] = {
          ...currentStay,
          hotelMode,

        const count = Math.max(Number(target.value || 1), 1);
        const currentStay = stays[stayIndex] || {};
        let hotels = [...(currentStay.hotels || [])];
        if (count > hotels.length) {
          while (hotels.length < count) {
            const baseNights = (currentStay.hotelMode || "split") === "parallel" ? Math.max(Number(currentStay.nights || 0), 0) : 0;
            hotels.push({ ...defaultHotelEntry({ ...currentStay, nights: baseNights }), assignedNights: baseNights });
          }
        } else if (count < hotels.length) {
          hotels = hotels.slice(0, count);
        }
        if ((currentStay.hotelMode || "split") === "parallel") {
          hotels = hotels.map(entry => ({ ...(entry || defaultHotelEntry(currentStay)), assignedNights: Math.max(Number(currentStay.nights || 0), 0) }));
        } else {
          const remainingNights = Math.max(Number(currentStay.nights || 0) - hotels.slice(0, -1).reduce((sum, entry) => sum + Math.max(Number(entry.assignedNights || 0), 0), 0), 0);
          if (hotels.length) hotels[hotels.length - 1] = { ...(hotels[hotels.length - 1] || {}), assignedNights: remainingNights };
        }
        stays[stayIndex] = { ...currentStay, hotels: hotels.map((entry, index) => applyHotelEntryRange({ ...currentStay, hotels }, index, entry)) };

          hotelSearchText: target.value,
          customHotelName: matched ? "" : target.value
        };
        stays[stayIndex] = { ...(stays[stayIndex] || {}), hotels: hotels.map((entry, index) => applyHotelEntryRange({ ...(stays[stayIndex] || {}), hotels }, index, entry)) };
        saveItineraryPatch({ hotelDetails: stays });
        return;

      if (target.matches("[data-room-row-field]")) {
        const stays = ensureHotelDetails(lead, itinerary);
        const stayIndex = Number(target.dataset.hotelStayIndex);
        const hotelIndex = Number(target.dataset.hotelEntryIndex);
        const roomIndex = Number(target.dataset.roomRowIndex);
        const field = target.dataset.roomRowField;
        const hotels = [...(stays[stayIndex]?.hotels || [])];
        const rooms = [...(hotels[hotelIndex]?.roomRows || [])];
        const baseRoom = { ...(rooms[roomIndex] || defaultHotelRoomRow(stays[stayIndex])) };
        if (field === "nights") {
          const entryNights = Math.max(Number(hotels[hotelIndex]?.assignedNights || 0), 0);
          const previousUsed = rooms.slice(0, roomIndex).reduce((sum, row) => sum + Math.max(Number(row.nights || 0), 0), 0);
          const remainingCapacity = Math.max(entryNights - previousUsed, 1);
          const requested = Math.max(Number(target.value || 1), 1);
          baseRoom.nights = Math.min(requested, remainingCapacity);
          rooms[roomIndex] = baseRoom;
          const consumed = rooms.slice(0, roomIndex + 1).reduce((sum, row) => sum + Math.max(Number(row.nights || 0), 0), 0);
          const remaining = Math.max(entryNights - consumed, 0);
          const nextRows = rooms.slice(roomIndex + 1);
          if (remaining > 0) {
            const nextRoom = {
              ...(nextRows[0] || defaultHotelRoomRow(stays[stayIndex], consumed + 1, remaining)),
              nights: remaining
            };
            rooms.splice(roomIndex + 1, rooms.length - (roomIndex + 1), nextRoom);
          } else {
            rooms.splice(roomIndex + 1);
          }
        } else {
          rooms[roomIndex] = {
            ...baseRoom,
            [field]: field === "extraQty" ? Math.max(Number(target.value || 0), 0) : target.value
          };
          if (field === "extraQty" && Number(target.value || 0) <= 0) rooms[roomIndex].extraType = "";
        }
        hotels[hotelIndex] = applyHotelEntryRange({ ...(stays[stayIndex] || {}), hotels }, hotelIndex, { ...(hotels[hotelIndex] || defaultHotelEntry(stays[stayIndex])), roomRows: rooms });

        const lines = target.value.split("\n").map(item => item.trim()).filter(Boolean);
        const info = ensureGoodToKnow(itinerary.goodToKnow);
        saveItineraryPatch({ goodToKnow: { ...info, [target.dataset.goodtoknowLines]: lines } });
        return;
      }
      if (target.matches("[data-goodtoknow-footnote]")) {
        const info = ensureGoodToKnow(itinerary.goodToKnow);
        saveItineraryPatch({ goodToKnow: { ...info, permitFootnote: target.value } });
        return;
      }
      if (target.matches("[data-permit-field]")) {
        const info = ensureGoodToKnow(itinerary.goodToKnow);
        const permits = [...info.permits];
        const index = Number(target.dataset.permitIndex);
        permits[index] = { ...(permits[index] || { region: "", requirement: "", tone: "warn" }), [target.dataset.permitField]: target.value };
        saveItineraryPatch({ goodToKnow: { ...info, permits } });
        return;
      }
      if (target.matches("[data-hero-upload]")) {
        const file = target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => saveItineraryPatch({ heroImage: reader.result });
        reader.readAsDataURL(file);
        return;
      }
      if (target.matches("[data-itinerary-field]")) {
        const key = target.dataset.itineraryField;
        const patch = { [key]: target.type === "number" ? Number(target.value || 0) : target.value };
        if (key === "routeTemplate") {
          Object.assign(patch, routeTemplatePatch(target.value));
        }
        if (["startLocation", "dropLocation"].includes(key)) {
          patch.routeModified = true;
        }
        if (key === "stage") {
          patch.notePreset = target.value;
          patch.note = noteForPreset(target.value);
        }
        if (key === "notePreset" && target.value !== "Custom") {
          patch.note = noteForPreset(target.value);
          patch.stage = target.value;
        }
        if (key === "note") {
          patch.notePreset = "Custom";
        }
        saveItineraryPatch(patch);
      }
      if (target.matches("[data-inclusion]")) {
        saveItineraryPatch({
          inclusions: {
            ...itinerary.inclusions,
            [target.dataset.inclusion]: target.checked
          }
        });
      }
      if (target.matches("[data-overview-sight]")) {
        const dayNumber = Number(target.dataset.overviewSight);
        const rows = overviewRowsWithSightseeing(lead, itinerary, dayNumber, currentIds => {
          const ids = new Set(currentIds);
          if (target.checked) ids.add(target.value);
          else ids.delete(target.value);
          return [...ids];
        });
        saveItineraryPatch({ overviewDays: rows });
        return;
      }
      if (target.matches("[data-family-label], [data-family-amount]")) {
        const rows = [...(itinerary.familyRows || [{ label: "Family 1", amount: Number(itinerary.costAmount || 0) }])];
        const index = Number(target.dataset.familyLabel ?? target.dataset.familyAmount);
        rows[index] = {
          ...(rows[index] || {}),
          ...(target.dataset.familyLabel !== undefined ? { label: target.value } : { amount: Number(target.value || 0) })
        };
        saveItineraryPatch({ familyRows: rows });
      }
      if (target.matches("[data-stop-location], [data-stop-nights]")) {
        const rows = [...(itinerary.routeStops || [])];
        const index = Number(target.dataset.stopLocation ?? target.dataset.stopNights);
        rows[index] = {
          ...(rows[index] || {}),
          ...(target.dataset.stopLocation !== undefined ? { location: target.value } : { nights: Number(target.value || 0) })
        };
        saveItineraryPatch({ routeStops: rows, routeModified: true });
      }
    });

    document.getElementById("editorPanes").addEventListener("keydown", event => {
      const target = event.target;
      if (!target.matches("[data-overview-slot]") || event.key !== "Tab" || event.shiftKey) return;
      const dayNumber = Number(target.dataset.overviewSlot);
      const slotIndex = Number(target.dataset.slotIndex);
      const card = target.closest(".overview-editor-day");
      if (!card) return;
      const nextSlot = card.querySelector(`[data-overview-slot="${dayNumber}"][data-slot-index="${slotIndex + 1}"]`);
      if (nextSlot) {
        event.preventDefault();
        nextSlot.focus();
        nextSlot.select?.();

      }

        event.preventDefault();
        noteField.focus();

    document.getElementById("editorPanes").addEventListener("click", event => {
      const target = event.target;
      const lead = selectedLead();
      if (!lead) return;
      const itinerary = ensureItinerary(lead);
      const removeSightButton = target.closest("[data-overview-remove-sight]");
      const selectTownButton = target.closest("[data-overview-select-town]");
      const clearTownButton = target.closest("[data-overview-clear-town]");
      const addCustomSightButton = target.closest("[data-overview-add-custom]");
      const subtabButton = target.closest("[data-overview-subtab]");
      const addSlotButton = target.closest("[data-overview-add-slot]");
      const addDestinationMasterButton = target.closest("[data-add-destination-master]");
      const addPermitRowButton = target.closest("[data-add-permit-row]");
      const removePermitRowButton = target.closest("[data-remove-permit-row]");
      const toggleRouteMasterButton = target.closest("[data-toggle-route-master]");
      const routeDestinationButton = target.closest("[data-route-master-dest]");
      const routeNightButton = target.closest("[data-route-master-night]");
      const useRouteTemplateButton = target.closest("[data-use-route-template]");

      }
      if (routeDestinationButton) {

        return;
      }
      if (routeNightButton) {

        renderEditorPane(activeEditorTab);
        return;
      }
      if (useRouteTemplateButton) {
        panes.dataset.aboutRoutePanel = "closed";

      if (clearRouteTemplateButton) {
        saveItineraryPatch({
          routeTemplate: "",
          routeTemplateName: "",
          routeSource: "",
          routeModified: true
        });
        return;
      }
      if (addDestinationMasterButton) {
        const destination = (itinerary.destinationOverride || lead.destination || "").trim();
        if (!destination) return;
        const locations = appState.masterData.locations || [];
        const exists = locations.some(item => String(typeof item === "string" ? item : item.name).trim().toLowerCase() === destination.toLowerCase());
        if (exists) {
          alert("This destination is already in Master Locations.");
          return;
        }
        appState.masterData.locations = [...locations, { id: uid(), name: destination }];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        renderEditorPane(activeEditorTab);
        return;
      }
      if (addPermitRowButton) {
        const info = ensureGoodToKnow(itinerary.goodToKnow);
        saveItineraryPatch({ goodToKnow: { ...info, permits: [...info.permits, { region: "New Region", requirement: "Permit update required", tone: "warn" }] } });
        return;
      }
      if (removePermitRowButton) {
        const info = ensureGoodToKnow(itinerary.goodToKnow);
        const permits = [...info.permits];
        if (permits.length > 1) permits.splice(Number(removePermitRowButton.dataset.removePermitRow), 1);
        saveItineraryPatch({ goodToKnow: { ...info, permits } });
        return;
      }
      if (subtabButton) {
        const dayNumber = subtabButton.dataset.overviewSubtab;
        const paneName = subtabButton.dataset.tab;
        const card = subtabButton.closest(".overview-editor-day");
        card.querySelectorAll(`[data-overview-subtab="${dayNumber}"]`).forEach(button => button.classList.toggle("active", button === subtabButton));
        card.querySelectorAll(`[data-overview-pane="${dayNumber}"]`).forEach(pane => pane.classList.toggle("active", pane.dataset.pane === paneName));
        return;
      }
      if (addSlotButton) {
        const dayNumber = Number(addSlotButton.dataset.overviewAddSlot);
        const rows = overviewRowsWithSightseeing(lead, itinerary, dayNumber, (currentIds, day, saved) => ({
          sightseeingIds: currentIds,
          sightSlotCount: Math.max(Number(saved.sightSlotCount || 0), 9) + 1
        }));
        saveItineraryPatch({ overviewDays: rows });
        return;
      }
      if (removeSightButton) {
        const dayNumber = Number(removeSightButton.dataset.overviewRemoveSight);
        const sightId = removeSightButton.dataset.sightId;
        const rows = overviewRowsWithSightseeing(lead, itinerary, dayNumber, currentIds => currentIds.filter(id => id !== sightId));
        saveItineraryPatch({ overviewDays: rows });
        return;
      }
      if (selectTownButton) {
        const dayNumber = Number(selectTownButton.dataset.overviewSelectTown);
        const town = selectTownButton.dataset.town || "";
        const day = generatedOverviewDays(lead, itinerary).find(item => Number(item.number) === dayNumber);
        const townIds = sightseeingOptionsForDay(lead, day || {})
          .filter(item => item.town === town)
          .slice(0, 3)
          .map(item => item.id);
        const rows = overviewRowsWithSightseeing(lead, itinerary, dayNumber, currentIds => [...new Set([...currentIds, ...townIds])]);
        saveItineraryPatch({ overviewDays: rows });
        return;
      }
      if (clearTownButton) {
        const dayNumber = Number(clearTownButton.dataset.overviewClearTown);
        const town = clearTownButton.dataset.town || "";
        const day = generatedOverviewDays(lead, itinerary).find(item => Number(item.number) === dayNumber);
        const townIds = new Set(sightseeingOptionsForDay(lead, day || {}).filter(item => item.town === town).map(item => item.id));
        const rows = overviewRowsWithSightseeing(lead, itinerary, dayNumber, currentIds => currentIds.filter(id => !townIds.has(id)));
        saveItineraryPatch({ overviewDays: rows });
        return;
      }
      if (addCustomSightButton) {
        const dayNumber = Number(addCustomSightButton.dataset.overviewAddCustom);
        const nameInput = document.querySelector(`[data-overview-custom-name="${dayNumber}"]`);
        const townInput = document.querySelector(`[data-overview-custom-town="${dayNumber}"]`);
        const categoryInput = document.querySelector(`[data-overview-custom-category="${dayNumber}"]`);
        const uspInput = document.querySelector(`[data-overview-custom-usp="${dayNumber}"]`);
        const descriptionInput = document.querySelector(`[data-overview-custom-description="${dayNumber}"]`);
        const name = nameInput?.value.trim();
        if (!name) return;
        const day = generatedOverviewDays(lead, itinerary).find(item => Number(item.number) === dayNumber) || {};
        const customItem = {
          id: `custom-sight-${uid()}`,
          destination: lead.destination || itinerary.destinationOverride || "",
          town: townInput?.value.trim() || day.stay || day.to || day.from || "Custom",
          name,
          category: categoryInput?.value.trim() || "Custom",
          description: descriptionInput?.value.trim() || "",
          usp: uspInput?.value.trim() || ""
        };
        const rows = overviewRowsWithSightseeing(lead, itinerary, dayNumber, currentIds => [...currentIds, customItem.id]);
        saveItineraryPatch({
          customSightseeing: [...(itinerary.customSightseeing || []), customItem],
          overviewDays: rows
        });
        return;
      }
      const addCabButton = target.closest("[data-add-cab]");
      const addCabVehicleButton = target.closest("[data-add-cab-vehicle]");
      const removeCabVehicleButton = target.closest("[data-remove-cab-vehicle]");
      const removeCabSegmentButton = target.closest("[data-remove-cab-segment]");
      const removeCabButton = target.closest("[data-remove-cab]");
      const syncHotelsButton = target.closest("[data-sync-hotels]");
      const addHotelEntryButton = target.closest("[data-add-hotel-entry]");
      const removeHotelEntryButton = target.closest("[data-remove-hotel-entry]");
      const addRoomRowButton = target.closest("[data-add-room-row]");
      const removeRoomRowButton = target.closest("[data-remove-room-row]");
      if (syncHotelsButton) {
        saveItineraryPatch({ hotelDetails: ensureHotelDetails(lead, itinerary) });
        return;
      }
      if (addHotelEntryButton) {
        const stays = ensureHotelDetails(lead, itinerary);
        const stayIndex = Number(addHotelEntryButton.dataset.addHotelEntry);
        const currentStay = stays[stayIndex] || {};
        const baseNights = (currentStay.hotelMode || "split") === "parallel" ? Math.max(Number(currentStay.nights || 0), 0) : 0;
        const hotels = [...(currentStay.hotels || []), { ...defaultHotelEntry({ ...currentStay, nights: baseNights }), assignedNights: baseNights }];
        stays[stayIndex] = { ...currentStay, hotels: hotels.map((entry, index) => applyHotelEntryRange({ ...currentStay, hotels }, index, entry)) };
        saveItineraryPatch({ hotelDetails: stays });
        return;
      }
      if (removeHotelEntryButton) {
        const stays = ensureHotelDetails(lead, itinerary);
        const stayIndex = Number(removeHotelEntryButton.dataset.removeHotelEntry);
        const hotelIndex = Number(removeHotelEntryButton.dataset.hotelEntryIndex);
        const currentStay = stays[stayIndex] || {};
        const hotels = [...(currentStay.hotels || [])];
        if (hotels.length > 1) hotels.splice(hotelIndex, 1);
        if (hotels.length === 1) hotels[0] = { ...hotels[0], assignedNights: Math.max(Number(currentStay.nights || 0), 0) };
        stays[stayIndex] = { ...currentStay, hotels: hotels.map((entry, index) => applyHotelEntryRange({ ...currentStay, hotels }, index, entry)) };
        saveItineraryPatch({ hotelDetails: stays });
        return;
      }
      if (addRoomRowButton) {
        const stays = ensureHotelDetails(lead, itinerary);
        const stayIndex = Number(addRoomRowButton.dataset.addRoomRow);
        const hotelIndex = Number(addRoomRowButton.dataset.hotelEntryIndex);
        const hotels = [...(stays[stayIndex]?.hotels || [])];
        const rooms = [...(hotels[hotelIndex]?.roomRows || []), defaultHotelRoomRow(stays[stayIndex])];
        hotels[hotelIndex] = { ...(hotels[hotelIndex] || defaultHotelEntry(stays[stayIndex])), roomRows: rooms };
        stays[stayIndex] = { ...(stays[stayIndex] || {}), hotels };
        saveItineraryPatch({ hotelDetails: stays });
        return;
      }
      if (removeRoomRowButton) {
        const stays = ensureHotelDetails(lead, itinerary);
        const stayIndex = Number(removeRoomRowButton.dataset.removeRoomRow);
        const hotelIndex = Number(removeRoomRowButton.dataset.hotelEntryIndex);
        const roomIndex = Number(removeRoomRowButton.dataset.roomRowIndex);
        const hotels = [...(stays[stayIndex]?.hotels || [])];
        const rooms = [...(hotels[hotelIndex]?.roomRows || [])];
        if (rooms.length > 1) rooms.splice(roomIndex, 1);
        hotels[hotelIndex] = { ...(hotels[hotelIndex] || defaultHotelEntry(stays[stayIndex])), roomRows: rooms };
        stays[stayIndex] = { ...(stays[stayIndex] || {}), hotels };
        saveItineraryPatch({ hotelDetails: stays });
        return;
      }
      if (addCabButton) {
        const cabs = ensureCabDetails(lead, itinerary);
        cabs.push(defaultCabDetail(lead, "Trip Vehicle"));
        saveItineraryPatch({ cabDetails: cabs });
        return;
      }
      if (addCabVehicleButton) {
        const cabs = ensureCabDetails(lead, itinerary);
        const key = addCabVehicleButton.dataset.addCabVehicle;
        const sameGroup = cabs.filter(cab => cabSegmentKey(cab) === key);
        cabs.push(nextCabForSameSegment(lead, sameGroup));
        saveItineraryPatch({ cabDetails: cabs });
        return;
      }
      if (removeCabVehicleButton) {
        const cabs = ensureCabDetails(lead, itinerary);
        const id = removeCabVehicleButton.dataset.removeCabVehicle;
        const targetCab = cabs.find(cab => cab.id === id);
        if (!targetCab) return;
        const key = cabSegmentKey(targetCab);
        const sameGroup = cabs.filter(cab => cabSegmentKey(cab) === key);
        if (sameGroup.length <= 1) return;
        saveItineraryPatch({ cabDetails: cabs.filter(cab => cab.id !== id) });
        return;
      }
      if (removeCabSegmentButton) {
        const cabs = ensureCabDetails(lead, itinerary);
        const key = removeCabSegmentButton.dataset.removeCabSegment;
        const remaining = cabs.filter(cab => cabSegmentKey(cab) !== key);
        if (!remaining.length) return;
        saveItineraryPatch({ cabDetails: remaining });
        return;
      }
      if (removeCabButton) {
        const cabs = ensureCabDetails(lead, itinerary);
        if (cabs.length > 1) cabs.splice(Number(removeCabButton.dataset.removeCab), 1);
        saveItineraryPatch({ cabDetails: cabs });
        return;
      }
      if (target.matches("[data-calc-add-row]")) {
        const calculator = ensureCostCalculator(itinerary);
        const rows = [...calculator.currentDraft.rows, defaultCalculatorRow()];
        saveItineraryPatch({
          costCalculator: {
            ...calculator,
            currentDraft: { ...calculator.currentDraft, rows, updatedAt: new Date().toISOString() }
          }
        });
        return;
      }
      if (target.matches("[data-calc-remove-row]")) {
        const calculator = ensureCostCalculator(itinerary);
        const rows = cloneCalculatorRows(calculator.currentDraft.rows);
        if (rows.length > 1) rows.splice(Number(target.dataset.calcRemoveRow), 1);
        else rows[0] = defaultCalculatorRow();
        saveItineraryPatch({
          costCalculator: {
            ...calculator,
            currentDraft: { ...calculator.currentDraft, rows, updatedAt: new Date().toISOString() }
          }
        });
        return;
      }
      if (target.matches("[data-calc-clear-draft]")) {
        if (!confirm("Clear the current calculator draft? Saved versions will remain untouched.")) return;
        const calculator = ensureCostCalculator(itinerary);
        saveItineraryPatch({
          costCalculator: {
            ...calculator,
            currentDraft: defaultCalculatorDraft(),
            viewVersionId: ""
          }
        });
        return;
      }
      if (target.matches("[data-calc-save-version]")) {
        const calculator = ensureCostCalculator(itinerary);
        const versionNumber = calculator.versions.length + 1;
        const summary = prompt(`Short note for V${versionNumber}`, "");
        if (summary === null) return;
        const rows = cloneCalculatorRows(calculator.currentDraft.rows);
        const version = {
          id: uid(),
          label: `V${versionNumber}`,
          savedAt: new Date().toISOString(),
          summary,
          rows,
          notes: calculator.currentDraft.notes || "",
          totals: calculatorTotals(rows)
        };
        saveItineraryPatch({
          costCalculator: {
            ...calculator,
            versions: [...calculator.versions, version],
            viewVersionId: version.id
          }
        });
        return;
      }
      if (target.matches("[data-calc-view-version]")) {
        const calculator = ensureCostCalculator(itinerary);
        saveItineraryPatch({ costCalculator: { ...calculator, viewVersionId: target.dataset.calcViewVersion } });
        return;
      }
      if (target.matches("[data-calc-close-version]")) {
        const calculator = ensureCostCalculator(itinerary);
        saveItineraryPatch({ costCalculator: { ...calculator, viewVersionId: "" } });
        return;
      }
      if (target.matches("[data-calc-load-version]")) {
        const calculator = ensureCostCalculator(itinerary);
        const version = calculator.versions.find(item => item.id === target.dataset.calcLoadVersion);
        if (!version) return;
        saveItineraryPatch({
          costCalculator: {
            ...calculator,
            currentDraft: {
              rows: cloneCalculatorRows(version.rows || []),
              notes: version.notes || version.summary || "",
              updatedAt: new Date().toISOString()
            },
            viewVersionId: version.id
          }
        });
        return;
      }
      if (target.matches("[data-add-family]")) {
        const rows = [...(itinerary.familyRows || [])];
        rows.push({ label: `Family ${rows.length + 1}`, amount: 0 });
        saveItineraryPatch({ familyRows: rows, costMode: "Per Family" });
      }
      if (target.matches("[data-remove-family]")) {
        const rows = [...(itinerary.familyRows || [])];
        if (rows.length > 1) rows.pop();
        saveItineraryPatch({ familyRows: rows });
      }
      if (target.matches("[data-add-stop]")) {
        const rows = [...(itinerary.routeStops || [])];
        rows.push({ location: "", nights: 0 });
        saveItineraryPatch({ routeStops: rows, routeModified: true });
        return;
      }
      if (target.matches("[data-remove-stop-index]")) {
        const rows = [...(itinerary.routeStops || [])];
        if (rows.length > 1) rows.splice(Number(target.dataset.removeStopIndex), 1);
        saveItineraryPatch({ routeStops: rows, routeModified: true });
        return;
      }
      if (target.matches("[data-remove-stop]")) {
        const rows = [...(itinerary.routeStops || [])];
        if (rows.length > 1) rows.pop();
        saveItineraryPatch({ routeStops: rows, routeModified: true });
        return;
      }
      if (target.matches("[data-reset-stops]")) {
        const stops = itinerary.routeStops?.length ? itinerary.routeStops.map(stop => stop.location || "") : [itinerary.startLocation || "Guwahati"];
        saveItineraryPatch({ routeStops: distributeNights(stops, Math.max(Number(lead.days || 1) - 1, 0)), routeModified: true });
        return;
      }
      if (target.matches("[data-save-custom-route]")) {
        const required = Math.max(Number(lead.days || 1) - 1, 0);
        const filled = routeNightsTotal(itinerary.routeStops || []);
        if (filled !== required) {
          alert(`Please fix route nights first. Current route has ${filled} of ${required} nights.`);
          return;
        }
        const defaultName = itinerary.routeTemplateName ? `${itinerary.routeTemplateName} - Custom` : `${lead.destination || "Route"} ${required}N Custom`;
        const templateName = prompt("Custom route name", defaultName);
        if (!templateName) return;
        const customRoute = {
          id: `custom-${uid()}`,
          source: "custom",
          templateName,
          destination: lead.destination || itinerary.destinationOverride || "",
          totalNights: required,
          startLocation: itinerary.startLocation || "Guwahati",
          dropLocation: itinerary.dropLocation || "Guwahati",
          stops: (itinerary.routeStops || []).map(stop => ({ location: stop.location || "", nights: Number(stop.nights || 0) }))
        };
        commitRouteMaster([...(appState.masterData.routes || []), customRoute]);
        saveItineraryPatch({
          routeTemplate: customRoute.id,
          routeTemplateName: customRoute.templateName,
          routeSource: "custom",
          routeModified: false,
          startLocation: customRoute.startLocation,
          dropLocation: customRoute.dropLocation,
          routeStops: customRoute.stops
        });
        return;
      }
      if (target.matches("[data-clear-hero]")) {
        saveItineraryPatch({ heroImage: "" });
      }
    });

    document.getElementById("downloadUniversalPdf").addEventListener("click", downloadUniversalPdf);
    document.getElementById("downloadLongPdf2").addEventListener("click", downloadLongMobilePdf);
    document.getElementById("downloadUniversalPdf2").addEventListener("click", downloadUniversalPdf);
    const printBtn = document.getElementById("printPdf"); if (printBtn) printBtn.addEventListener("click", printFullPdf);
    const printBtn2 = document.getElementById("printPdf2"); if (printBtn2) printBtn2.addEventListener("click", printFullPdf);
    window.addEventListener("afterprint", () => {
      document.getElementById("dynamicPrintSize")?.remove();
      renderMobileOutput();
    });

    const urlParams = new URLSearchParams(window.location.search);
    const embeddedLeadId = urlParams.get("leadId");
    if (embeddedLeadId) {
      appState.selectedLeadId = embeddedLeadId;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    }

    renderEditorTabs();
    renderMasterTabs();
    if (urlParams.get("embedded") === "1" && selectedLead()) {
      switchView("editor");
    } else {
      renderAll();
    }
    loadSharedRouteMaster();
    loadHotelMasterSeed();
  </script>
</body>
</html>
